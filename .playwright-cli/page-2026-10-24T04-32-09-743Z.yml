                  - text: 三大法人10/16(五)合計賣超685.14億元,外資賣超461.47億元,投信逆勢買超110.48億元
                  - generic [ref=e322]: 中性
                - paragraph [ref=e323]: 依證交所統計,三大法人10/16合計淨賣超685.14億元,為近期最大單日賣超規模,其中外資賣超461.47億元、自營商賣超334.14億元,投信則逆勢買超110.48億元。外資與自營商同步大幅調節,顯示外部資金在美股半導體股重挫、Fed偏鷹訊號下轉趨保守,但投信內資維持買盤,與美股情緒出現分歧,加權指數當日仍收漲0.3%至47111點。
