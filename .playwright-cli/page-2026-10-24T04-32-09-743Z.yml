                  - text: 板塊資金動向:晶圓代工、IC設計連8日資金流出,電信連12日吸金穩居冠軍
                  - generic [ref=e330]: 中性
                - paragraph [ref=e331]: 依板塊資金追蹤,晶圓代工近20個交易日資金淨流出2107.2億元,已連續8日流出且流出速度加快,台積電為主要調節標的;IC設計同樣連8日流出,近20日淨流出804.2億元,但流出速度已放緩。資金流入方面,電信板塊近20日淨流入187.5億元、已連續12日流入,資金排名全市場第1(共31個板塊),個股如中華電近20日法人買超佔成交金額達35.9%(全市場前1%);金融(連5日流入、近20日+442.6億元)、航運(連5日流入、+274.7億元)、鋼鐵(連6日流入、+61.0億元)同列資金偏多。另外AI伺服器代工與記憶體板塊雖20日仍淨流出(分別-664.8億元、-192.4億元),但最近1個交易日轉為小幅買超,是否延續仍待觀察。
