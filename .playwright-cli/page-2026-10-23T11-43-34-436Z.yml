                  - generic [ref=e276]: 利空
                - paragraph [ref=e277]: 台積電ADR(TSM)隨美股半導體全面重挫同步下跌4.63%,收411.89美元,較台北現股(10/21收2420元)溢價由前一日的高檔收窄至10.94%。傳導路徑為:美股費半重挫→台積電ADR領跌→台北開盘時台積電現股及晶圓代工、設備族群情緒承壓;若溢價持續收斂,代表外資在美盤的賣壓已超過台北現股的既有估值,台股開盘補跌風險隨之上升。
