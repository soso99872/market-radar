<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>起漲雷達</title>
<meta name="description" content="營收動能與爆量突破:找爆發前與剛爆發的個股,附回測與實績追蹤">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/common.css">
<style>
main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.status b { font-family: var(--mono); font-weight: 600; color: var(--text); }
.status .sep { width: 1px; height: 12px; background: var(--line); }
.verdict { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 16px; }
.verdict h2 { margin: 0 0 6px; font-size: 15px; font-weight: 900; }
.verdict ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.verdict b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.verdict .k { color: var(--text); font-family: var(--sans); font-weight: 700; }
.verdict details { margin-top: 8px; font-size: 13px; color: var(--muted); }
.verdict summary { cursor: pointer; color: var(--text); }
.tabs .seg button { height: 34px; padding: 0 14px; font-size: 14px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 4px 0 -4px; }
.sec-h h2 { margin: 0; font-size: 18px; font-weight: 900; }
.sec-h p { margin: 0; font-size: 13px; color: var(--muted); }
.evi { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.ev { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--muted); }
.ev > span { display: block; color: var(--text); font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.ev dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; margin: 0; }
.ev dt { font-size: 11px; color: var(--faint); }
.ev dd { margin: 0; font-family: var(--mono); font-weight: 600; color: var(--text); font-size: 13.5px; }
.ev dd small { color: var(--faint); font-weight: 400; font-size: 11px; display: block; }
.ev p { margin: 6px 0 0; font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.tools label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; align-items: start; }
.pc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.pc.livehit { border-color: var(--accent); }
.pc-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pc-h .stock-link { font-size: 16px; font-weight: 900; }
.pc-h .stock-link b { font-family: var(--mono); margin-right: 6px; }
.pc-h .px { font-family: var(--mono); margin-left: auto; font-size: 14px; }
.px .lv { font-family: var(--sans); font-size: 11px; color: var(--accent); margin-left: 4px; }
.tag2 { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 0 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.tag2.hot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.tag2.dim { color: var(--faint); }
.fvl { margin: 6px 0 2px; font-size: 13px; color: var(--muted); }
.fvl b { font-family: var(--mono); color: var(--text); }
.st3 { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 0 6px; color: var(--muted); border: 1px solid var(--line); }
.st3.lo { color: var(--up); border-color: color-mix(in srgb, var(--up) 50%, transparent); }
.st3.hi { color: var(--down); border-color: color-mix(in srgb, var(--down) 50%, transparent); }
.tk.rank td, .tk.rank th { white-space: nowrap; font-size: 13.5px; }
.tk.rank td.l, .tk.rank th.l { text-align: left; font-family: var(--sans); }
.tk.rank td.rk { color: var(--faint); }
.tk.rank td.sm { font-size: 12px; color: var(--muted); }
.tk.rank .stock-link b { font-family: var(--mono); }
.tag2.warn { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, transparent); }
table.pf { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.pf th { font-size: 12px; color: var(--faint); font-weight: 500; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.pf td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; }
.pf th:first-child, .pf td:first-child { text-align: left; font-family: var(--sans); }
.pf tr.hl td { background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }
.pf tr.dim td { color: var(--muted); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.box h3 { margin: 0 0 6px; font-size: 15px; font-weight: 900; }
.box p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.cy { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.cy .pc h4 { margin: 0; font-size: 15px; font-weight: 900; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.cy .pc h4 a { text-decoration: none; }
.st2 { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 0 6px; }
.st2.s0 { color: var(--accent-ink); background: var(--accent); }
.st2.s1 { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.st2.s2 { color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent); }
.st2.s3 { color: var(--faint); border: 1px solid var(--line); }
.kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.kpi div { background: var(--panel-2); padding: 4px 8px; min-width: 0; }
.kpi span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; }
.kpi b { font-family: var(--mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.why { margin: 0; padding-left: 1.1em; font-size: 13.5px; display: grid; gap: 2px; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin: 6px 0 2px; }
.bars i { flex: 1; background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 1px 1px 0 0; min-height: 1px; }
.bars i:last-child { background: var(--accent); }
.bcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-family: var(--mono); margin-bottom: 6px; }
.pc .chips { margin-top: 8px; }
.more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 14px; justify-self: start; }
.note { font-size: 12.5px; color: var(--faint); margin: 0; }
.live { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.live b { font-family: var(--mono); }
table.tk { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tk th { font-size: 12px; color: var(--faint); font-weight: 500; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tk td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
.tk th:first-child, .tk td:first-child { text-align: left; font-family: var(--sans); }
.tkwrap { overflow-x: auto; }
@media (max-width: 420px) { .kpi { grid-template-columns: repeat(2, 1fr); } .ev dl { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--line)" stroke-width="1.5"/>
        <circle cx="13" cy="13" r="6.5" fill="none" stroke="var(--line)" stroke-width="1.5"/>
        <path d="M13 13 L13 1.5 A11.5 11.5 0 0 1 23.5 8.2 Z" fill="var(--accent)" opacity=".85"/>
        <circle cx="18.5" cy="8.5" r="1.8" fill="var(--text)"/>
      </svg>
      <div><b>盤前雷達</b><br><span>台美股 · 每個交易日 07:30</span></div>
    </a>
    <nav class="nav" aria-label="頁面">
      <a href="./">晨報</a>
      <a href="sectors.html">板塊資金</a>
      <a href="radar.html" aria-current="page">起漲雷達</a>
      <a href="watch.html">觀察名單</a>
      <a href="signals.html">訊號回測</a>
    </nav>
    <div class="seg" role="group" aria-label="漲跌顏色">
      <button type="button" id="conv-tw" aria-pressed="true">紅漲綠跌</button>
      <button type="button" id="conv-us" aria-pressed="false">綠漲紅跌</button>
    </div>
  </div>
</header>

<main id="app"><p class="err">載入中…</p></main>

<footer>
  名單依公開的月營收、股價與成交資料,用固定規則篩出;每個交易日收盤後自動更新,開啟頁面時若證交所已公布更新的收盤資料,上市股會直接用官方資料即時更新。
  不是買賣建議,也不代表會漲。回測期間是 AI 多頭行情,空頭時表現可能差很多。
</footer>

<script src="assets/common.js"></script>
<script src="assets/live.js"></script>
<script>
(function () {
  "use strict";
  var esc = MR.esc, pct = MR.pct, sign = MR.sign, dir = MR.dir;
  var app = document.getElementById("app");
  var R = null, TK = null, AU = null, LIVE = null, LIVEHITS = [];
  var view = (location.hash || "#rank").slice(1);
  if (["rank", "rev", "cycle", "breakout", "track"].indexOf(view) < 0) view = "rank";
  var hideLow = true, onlyNew = false, sortBy = "new", showAll = {}, rankFilter = "all", rankSort = "score", FVT = null;
  try { hideLow = localStorage.getItem("radar.hideLow") !== "0"; } catch (e) {}
  MR.setupConv();

  function num(v, d, suf) { return v == null ? "—" : sign(v, d) + (suf || ""); }
  function plain(v, d, suf) { return v == null ? "—" : v.toFixed(d) + (suf || ""); }

  function ev(id, h) {
    var s = R.stats[id], z = s && s.horizons[h], b = R.base[h];
    if (!z || !z.n) return "";
    return '<div class="ev"><span>' + esc(s.name) + MR.gradeTag(z.grade) + "</span><dl>" +
      "<div><dt>" + h + " 日平均</dt><dd class=\"" + dir(z.avg) + "\">" + num(z.avg, 1, "%") + "<small>基準 " + num(b.avg, 1, "%") + "</small></dd></div>" +
      "<div><dt>中位數</dt><dd class=\"" + dir(z.med) + "\">" + num(z.med, 1, "%") + "<small>基準 " + num(b.med, 1, "%") + "</small></dd></div>" +
      "<div><dt>120 日內翻倍</dt><dd>" + plain(z.double, 1, "%") + "<small>基準 " + plain(b.double, 1, "%") + "</small></dd></div>" +
      "<div><dt>" + h + " 日虧 &gt;15%</dt><dd>" + plain(z.loss15, 1, "%") + "<small>基準 " + plain(b.loss15, 1, "%") + "</small></dd></div></dl>" +
      "<p>比同日一般股 " + num(z.avg_rel, 2, "%") + " · t = " + plain(z.t, 1) + " · 近一年 " + num(z.oos_avg_rel, 2, "%") + " · 樣本 " + z.n.toLocaleString("en-US") +
      (z.top10_share ? " · 報酬最好的 1/10 樣本貢獻了 " + Math.round(z.top10_share) + "% 的超額報酬" : "") + "</p></div>";
  }

  function verdict() {
    var a = R.stats.rev_high.horizons["60"], b = R.base["60"], bo = R.stats.breakout.horizons["60"], br = R.stats.breakout_rev.horizons["60"], bn = R.stats.breakout_norev.horizons["60"];
    return '<section class="verdict"><h2>這頁在找什麼、有多準</h2><ul>' +
      '<li><span class="k">爆發前:看營收,不看籌碼。</span>騰輝這類股在起漲前法人幾乎不在場,籌碼看不出來;但營收會先創新高。月營收創 12 個月新高、且年增 ≥ 30%(或連續 2 個月年增 ≥ 20%)的股票,公告後 60 日平均 <b>' +
      num(a.avg, 1, "%") + "</b>、中位數 <b>" + num(a.med, 1, "%") + "</b>(一般股 " + num(b.avg, 1, "%") + " / " + num(b.med, 1, "%") + ")," + (a.med > 0 ? "是少數中位數為正的條件" : "中位數雖然接近 0,但遠好於一般股") + "(證據:" + esc(a.grade) + ")。</li>" +
      '<li><span class="k">剛爆發:爆量突破要搭配營收。</span>有營收成長的突破 60 日平均 <b>' + num(br.avg, 1, "%") + "</b>,營收衰退的突破只有 <b>" + num(bn.avg, 1, "%") +
      "</b>;突破訊號本身證據為「" + esc(bo.grade) + "」,而且年度之間不穩定,當確認用,不當主訊號。</li>" +
      '<li><span class="k">命中率要有正確期待。</span>符合條件後 120 日內翻倍的比例約 <b>' + plain(a.double, 0, "%") + "</b>(隨便挑一檔是 " + plain(b.double, 0, "%") +
      "),也就是約 " + Math.round(100 / (a.double || 1)) + " 檔才有 1 檔;同時約 <b>" + plain(a.loss15, 0, "%") + "</b> 會在 60 日內虧超過 15%。報酬集中在少數大漲股,所以要<span class=\"k\">分散買 10 檔左右</span>(見營收動能頁下方的組合模擬)。</li>" +
      '<li><span class="k">整個產業的漲價行情看「產業循環」。</span>被動元件 2025 年底那波漲了 4 倍,產業營收轉強訊號在板塊只漲 6% 時就出現。</li>' +
      "</ul><details><summary>方法與限制</summary><ul>" +
      "<li>營收資料:公開資訊觀測站月營收彙總表(" + esc(R.span[0]) + " 起),回測時視為次月 11 日才知道,隔天開盤進場,扣交易成本 " + R.cost_pct.toFixed(3) + "%。</li>" +
      "<li>評級門檻已依多重比較拉高(強:t ≥ 3.5;中:t ≥ 2.5)。這些規則是看過 2023–2026 資料後才定的,所以「近一年」也不是真正的樣本外;真正的檢驗是下方的<b>實績追蹤</b>,從 " + esc((TK && TK.since) || R.date) + " 起每天記錄名單、事後結算。</li>" +
      "<li>回測期間是 AI 多頭,隨便挑都有 " + plain(b.double, 0, "%") + " 會翻倍;空頭時這些數字會差很多。資料不含已下市股票,結果偏樂觀。</li>" +
      "<li>「低波動」= 近 60 日日報酬波動在可交易股票後 30%(像中華電這類),預設隱藏,因為很難有爆發力。</li></ul></details></section>";
  }

  function bars(h) {
    var v = (h || []).filter(function (x) { return x != null; });
    if (v.length < 3) return "";
    var mx = Math.max.apply(null, v) || 1;
    return '<div class="bars" aria-label="近 13 個月營收">' + v.map(function (x) { return '<i style="height:' + Math.max(2, x / mx * 100).toFixed(0) + '%"></i>'; }).join("") + "</div>" +
      '<div class="bcap"><span>13 個月前</span><span>月營收(億)最新 ' + v[v.length - 1].toFixed(1) + "</span></div>";
  }

  function pxHtml(x) {
    return '<span class="px" data-px="' + esc(x.code) + '">' + (x.close == null ? "—" : x.close) + " " + pct(x.chg) + "</span>";
  }

  function chips(x) {
    return x.themes && x.themes.length ? '<div class="chips">' + x.themes.map(function (t) {
      return '<a class="th-chip" href="sectors.html#' + esc(t.id) + '">' + esc(t.name) + "</a>";
    }).join("") + "</div>" : "";
  }

  function fvLine(x) {
    var e = x.fv;
    if (!e) return '<p class="fvl">模型合理價:資料不足</p>';
    return '<p class="fvl">模型合理價 <b>' + e.fair + "</b>(" + e.low + "~" + e.high + ")· 潛在空間 <b class=\"" + dir(e.up) + "\">" + sign(e.up, 0) + "%</b>" + (e.extreme ? '(⚠ 偏離太大,公式不適用)' : "") + " · " +
      '<span class="st3 ' + (e.status === "低估" ? "lo" : e.status === "高估" ? "hi" : "") + '">' + e.status + "</span></p>";
  }

  function tags(x) {
    return (x.above_ma60 === true ? '<span class="tag2">站上季線</span>' : x.above_ma60 === false ? '<span class="tag2 dim">季線下</span>' : "") +
      (x.dumped ? '<span class="tag2 warn">法人大賣</span>' : "") +
      (x.low_vol ? '<span class="tag2 dim">低波動</span>' : "");
  }

  function revCard(x) {
    return '<article class="pc"><div class="pc-h"><button type="button" class="stock-link" data-stock="' + esc(x.code) + '"><b>' + esc(x.code) + "</b>" + esc(x.name) + "</button>" +
      (x.rev_new ? '<span class="tag2 hot">' + esc(x.rev_month.slice(5).replace(/^0/, "")) + " 月新公告</span>" : '<span class="tag2">' + esc(x.rev_month.slice(5).replace(/^0/, "")) + " 月</span>") +
      tags(x) + pxHtml(x) + "</div>" +
      '<div class="kpi"><div><span>營收年增</span><b class="' + dir(x.yoy) + '">' + num(x.yoy, 0, "%") + "</b></div>" +
      "<div><span>連續創新高</span><b>" + x.rev_streak + " 個月</b></div>" +
      "<div><span>距 52 週高</span><b>" + num(x.hi250, 0, "%") + "</b></div>" +
      "<div><span>20 日漲跌</span><b class=\"" + dir(x.ret20) + "\">" + num(x.ret20, 0, "%") + "</b></div></div>" +
      fvLine(x) + bars(x.rev_hist) +
      '<ul class="why"><li>' + x.why.map(esc).join("</li><li>") + "</li></ul>" + chips(x) + "</article>";
  }

  function boCard(x, live) {
    return '<article class="pc' + (live ? " livehit" : "") + '"><div class="pc-h"><button type="button" class="stock-link" data-stock="' + esc(x.code) + '"><b>' + esc(x.code) + "</b>" + esc(x.name) + "</button>" +
      (live ? '<span class="tag2 hot">今日即時</span>' : '<span class="tag2' + (x.days_ago === 0 ? " hot" : "") + '">' + (x.days_ago === 0 ? "今日" : x.days_ago + " 天前") + "</span>") +
      (x.rev_ok ? '<span class="tag2 hot">營收成長</span>' : '<span class="tag2 dim">營收未成長</span>') +
      tags(x) + pxHtml(x) + "</div>" +
      '<div class="kpi"><div><span>爆量倍數</span><b>' + plain(x.surge, 1, "×") + "</b></div>" +
      "<div><span>當天漲幅</span><b class=\"" + dir(x.day_chg) + "\">" + num(x.day_chg, 1, "%") + "</b></div>" +
      "<div><span>3 月營收年增</span><b class=\"" + dir(x.yoy3) + "\">" + num(x.yoy3, 0, "%") + "</b></div>" +
      "<div><span>突破後</span><b class=\"" + dir(x.since) + "\">" + num(x.since, 1, "%") + "</b></div></div>" +
      fvLine(x) + '<ul class="why"><li>' + x.why.map(esc).join("</li><li>") + "</li></ul>" + chips(x) + "</article>";
  }

  function seg(name, cur, opts) {
    return '<div class="seg" role="group" aria-label="' + name + '">' + opts.map(function (o) {
      return '<button type="button" data-' + name + '="' + o[0] + '" aria-pressed="' + (o[0] === cur) + '">' + o[1] + "</button>";
    }).join("") + "</div>";
  }

  function list(key, items, limit, fn) {
    var shown = showAll[key] ? items : items.slice(0, limit);
    return '<div class="cards">' + shown.map(function (x) { return fn(x); }).join("") + "</div>" +
      (items.length > limit ? '<button type="button" class="more" data-all="' + key + '">' + (showAll[key] ? "收合" : "顯示全部 " + items.length + " 檔") + "</button>" : "") +
      (items.length ? "" : '<p class="note">目前沒有符合條件的個股。</p>');
  }

  function revView() {
    var items = R.rev.filter(function (x) { return (!hideLow || !x.low_vol) && (!onlyNew || x.rev_new); });
    var key = {
      "new": function (x) { return (x.rev_new ? 0 : 1e6) - (x.yoy3 || 0); },
      streak: function (x) { return -x.rev_streak * 1000 - (x.yoy || 0); },
      lag: function (x) { return x.hi250 == null ? 1e6 : x.hi250; },
      yoy: function (x) { return -(x.yoy || 0); }
    }[sortBy];
    items = items.slice().sort(function (a, b) { return key(a) - key(b); });
    return '<div class="sec-h"><h2>營收動能 · 爆發前</h2><p>最新公布的月營收創近 12 個月新高,且年增 ≥ 30% 或連續 2 個月年增 ≥ 20%。共 ' + items.length + " 檔。</p></div>" +
      '<div class="evi">' + ev("rev_high", "60") + ev("rev_high", "20") + "</div>" +
      '<div class="tools"><span>排序</span>' + seg("sort", sortBy, [["new", "新公告優先"], ["streak", "連續創新高"], ["lag", "股價尚未反映"], ["yoy", "年增最高"]]) +
      '<label><input type="checkbox" data-opt="hideLow"' + (hideLow ? " checked" : "") + "> 隱藏低波動股</label>" +
      '<label><input type="checkbox" data-opt="onlyNew"' + (onlyNew ? " checked" : "") + "> 只看 " + esc(R.rev_latest.slice(5).replace(/^0/, "")) + " 月新公告</label></div>" +
      list("rev", items, 18, revCard) + portfolioBox() +
      '<p class="note">年增極高(例如數百 %)常是去年基期很低的景氣循環股,不一定代表長期成長;「連續創新高」月數越多,通常代表成長越持續。「股價尚未反映」排序是距 52 週高點最遠的在前,這類股票沒有經過額外回測。</p>';
  }

  function boView() {
    var items = R.breakout.filter(function (x) { return !hideLow || !x.low_vol; });
    var liveHtml = "";
    if (LIVEHITS.length) {
      liveHtml = '<div class="sec-h"><h2 style="font-size:16px">今日即時突破(上市)</h2><p>用證交所 ' + esc(LIVE.date) + " 官方收盤資料在你的瀏覽器即時判斷;上櫃與營收確認待排程更新。</p></div>" +
        '<div class="cards">' + LIVEHITS.map(function (x) { return boCard(x, true); }).join("") + "</div>";
    }
    return '<div class="sec-h"><h2>爆量突破 · 剛爆發</h2><p>近 10 個交易日成交爆量、突破整理並創 52 週新高的個股。共 ' + items.length + " 檔。</p></div>" +
      '<div class="evi">' + ev("breakout_rev", "60") + ev("breakout", "60") + ev("breakout_norev", "60") + "</div>" +
      liveHtml +
      '<div class="tools"><label><input type="checkbox" data-opt="hideLow"' + (hideLow ? " checked" : "") + "> 隱藏低波動股</label></div>" +
      list("bo", items, 18, function (x) { return boCard(x, false); }) +
      '<p class="note">爆量突破整體統計不夠顯著,而且中位數為負:多數突破之後會拉回。有營收成長支撐的突破明顯較好,營收衰退的突破歷史上平均是虧的。</p>';
  }

  function fvEvidence() {
    if (!FVT) return '<p class="note">模型合理價的歷史回測尚未產生。</p>';
    var q = FVT.quintiles || [], h = FVT.hold;
    var rows = q.map(function (x) {
      return "<tr><td>" + esc(x.label) + "</td><td>" + sign(x.up_med, 0) + "%</td><td class=\"" + dir(x.rel) + "\">" + sign(x.rel, 2) + "%</td><td>" + sign(x.med, 2) + "%</td><td>" + plain(x.mwin, 0, "%") + "</td></tr>";
    }).join("");
    return '<div class="box"><h3>估值合理價有用嗎?歷史回測(' + esc(FVT.span[0]) + " ~ " + esc(FVT.span[1]) + "," + FVT.months + " 個月)</h3>" +
      '<table class="pf"><thead><tr><th>每月依潛在空間分 5 組</th><th>空間中位數</th><th>之後 ' + h + " 日比一般股</th><th>中位數</th><th>月勝率</th></tr></thead><tbody>" + rows + "</tbody></table>" +
      "<p><b style=\"color:var(--text)\">" + esc(FVT.verdict) + "</b></p>" +
      "<p>分期間看:2021–2023 估值便宜的一組略好(+2.4%,t = 1.8,不顯著),2023–2026 反而是貴的一組較好。不論哪一段,起漲雷達名單內「估值空間較小」的一半都比「空間較大」的一半表現好(名單內的高成長股,市場願意給更高評價)。所以估值合理價只用來了解股價相對自身歷史的位置,排序請用動能分數。</p></div>";
  }

  function momEvidence() {
    var M = R.momentum;
    if (!M) return "";
    var lab = ["最低 1/5", "第 2 組", "第 3 組", "第 4 組", "最高 1/5"];
    var rows = M.quintiles.map(function (q, i) {
      return q ? "<tr" + (i === 4 ? ' class="hl"' : "") + "><td>" + lab[i] + '</td><td class="' + dir(q.rel) + '">' + sign(q.rel, 1) + "%</td><td>" + plain(q.win, 0, "%") +
        '</td><td class="' + dir(q.p25) + '">' + sign(q.p25, 0) + '%</td><td class="' + dir(q.p50) + '">' + sign(q.p50, 0) + '%</td><td class="' + dir(q.p75) + '">' + sign(q.p75, 0) + "%</td><td>" + q.n + "</td></tr>" : "";
    }).join("");
    return '<div class="box"><h3>動能分數與統計 60 日區間怎麼來(' + esc(R.span[0].slice(0, 4)) + " 起的所有營收公告日)</h3>" +
      '<table class="pf"><thead><tr><th>名單內依動能分數分組</th><th>60 日比一般股</th><th>勝過一般股</th><th>25%</th><th>中位數</th><th>75%</th><th>樣本</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      "<p>動能分數 = 名單內各股在「" + M.feats.join("、") + "」四項的排名平均(0~100,越高越強)。2019–2023 與 2023–2026 兩段期間,分數最高 1/5 都明顯勝過最低 1/5(比一般股約 +12% / +9% 對 0%)," +
      "但這個組合是看過兩段資料才定的,實績追蹤才是真正的檢驗。統計 60 日區間 = 目前股價 × 歷史上同分組股票 60 日後報酬的 25% / 中位數 / 75% 百分位;它是過去同類股票的實際分布,不是預測,而且即使是最高分組,中位數也只比 0 高一點、四分之一會跌超過 14%。</p></div>";
  }

  function rankView() {
    var key = { score: function (x) { return -(x.mom ? x.mom.score : -1); }, up: function (x) { return x.fv ? -(x.fv.up || -999) : 999; }, streak: function (x) { return -(x.rev_streak || 0) * 1000 - (x.fv.up || 0) / 1000; },
      high: function (x) { return x.hi250 == null ? 999 : -x.hi250; } }[rankSort];
    var items = (R.rank || []).slice().sort(function (a, b) { return key(a) - key(b); }).filter(function (x) {
      if (hideLow && x.low_vol) return false;
      if (rankFilter === "lo") return x.fv && x.fv.status === "低估";
      if (rankFilter === "ok") return x.fv && x.fv.status !== "高估";
      if (rankFilter === "sane") return x.fv && !x.fv.extreme;
      return true;
    });
    var rows = items.slice(0, showAll.rank ? 999 : 40).map(function (x, i) {
      var e = x.fv || {}, m = x.mom, pj = m && m.proj;
      return '<tr><td class="rk">' + (i + 1) + '</td><td class="l"><button type="button" class="stock-link" data-stock="' + esc(x.code) + '"><b>' + esc(x.code) + "</b> " + esc(x.name) + "</button></td>" +
        '<td data-px="' + esc(x.code) + '">' + x.close + "</td>" +
        "<td><b>" + (m ? m.score : "—") + "</b></td>" +
        '<td class="sm">' + (pj ? pj.p25 + " ~ <b>" + pj.p50 + "</b> ~ " + pj.p75 : "—") + "</td>" +
        "<td>" + (e.fair == null ? "—" : e.fair) + "</td>" +
        '<td class="' + dir(e.up) + '">' + (e.up == null ? "—" : sign(e.up, 0) + "%") + (e.extreme ? ' <span class="st3 hi" title="偏離太大,多半是景氣轉折或一次性損益,固定公式不適用">⚠</span>' : "") + "</td>" +
        "<td>" + (e.status ? '<span class="st3 ' + (e.status === "低估" ? "lo" : e.status === "高估" ? "hi" : "") + '">' + e.status + "</span>" : "—") + "</td>" +
        '<td class="' + dir(x.yoy) + '">' + num(x.yoy, 0, "%") + '</td><td class="l sm">' + x.src.join("、") + (x.above_ma60 === false ? "、季線下" : "") + (x.dumped ? "、法人大賣" : "") + "</td></tr>";
    }).join("");
    return '<div class="sec-h"><h2>潛在排行</h2><p>營收動能名單依「動能分數」排序,並附兩種客觀價格:依歷史同分組實際落點換算的「統計 60 日區間」,以及依本益比河流圖算的「估值合理價」。點代號看算式與詳細資料。</p></div>' +
      momEvidence() + fvEvidence() +
      '<div class="tools"><span>排序</span>' + seg("rs", rankSort, [["score", "動能分數"], ["up", "估值空間"], ["streak", "營收連續創新高"], ["high", "接近 52 週高"]]) +
      "<span>只看</span>" + seg("rf", rankFilter, [["all", "全部"], ["sane", "排除公式不適用"], ["ok", "排除高估"], ["lo", "只看低估"]]) +
      '<label><input type="checkbox" data-opt="hideLow"' + (hideLow ? " checked" : "") + "> 隱藏低波動股</label><span>共 " + items.length + " 檔</span></div>" +
      '<div class="tkwrap"><table class="tk rank"><thead><tr><th>#</th><th class="l">個股</th><th>股價</th><th>動能分數</th><th>統計 60 日區間(25%~中位~75%)</th><th>估值合理價</th><th>估值空間</th><th>估值評價</th><th>營收年增</th><th class="l">入選原因</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
      (items.length > 40 ? '<button type="button" class="more" data-all="rank">' + (showAll.rank ? "收合" : "顯示全部 " + items.length + " 檔") + "</button>" : "") +
      '<p class="note">模型合理價 = 預估 EPS × 這檔股票自己過去 5 年本益比中位數(虧損股改用淨值比),預估 EPS = 近四季 EPS × 近 3 月營收年化 ÷ 近 12 月營收。這是固定公式算出的參考值,不是目標價或買賣建議;它假設淨利率不變、評價會回到歷史常態,兩者實際上都會變。潛在空間很大常常代表市場認為這次不一樣(例如景氣反轉或一次性獲利),請搭配上方回測判斷可信度。</p>';
  }

  function portfolioBox() {
    var P = R.portfolio;
    if (!P) return "";
    var rows = P.rows.map(function (x) {
      var label = x.random ? "對照:全市場隨便買 10 檔" : "從名單買 " + x.k + " 檔" + (x.stop ? ",每檔跌 15% 停損" : "");
      return '<tr class="' + (x.k === 10 && !x.stop && !x.random ? "hl" : x.random ? "dim" : "") + '"><td>' + label + "</td>" +
        '<td class="' + dir(x.avg) + '">' + num(x.avg, 1, "%") + '</td><td class="' + dir(x.med) + '">' + num(x.med, 1, "%") + "</td>" +
        "<td>" + plain(x.win, 0, "%") + "</td><td>" + plain(x.loss15, 1, "%") + "</td><td>" + num(x.p5, 1, "%") + "</td></tr>";
    }).join("");
    return '<div class="box"><h3>照名單操作會怎樣:分散比挑股更能降低風險</h3><table class="pf"><thead><tr><th>做法(每月營收公告後進場,持有 ' + P.hold +
      " 日)</th><th>平均</th><th>中位數</th><th>賺錢機率</th><th>整筆虧 &gt;15%</th><th>最差 5%</th></tr></thead><tbody>" + rows + "</tbody></table>" +
      "<p>從名單隨機抽股、等權持有,重複抽樣模擬。只買 1 檔時大約每 5 次有 1 次虧超過 15%;買 10 檔平均報酬不變,但大虧機率降到約 1/30。每檔各設停損反而更差:大盤急跌時全部同時停損,剛好賣在低點。風險請用「投入多少錢」控制,不要靠單檔停損。</p></div>";
  }

  function cycleView() {
    var C = R.cycle;
    if (!C) return '<p class="note">產業循環資料尚未產生。</p>';
    function st(k) {
      var z = C.stats[k], a = z["60"], b = z["120"];
      return '<div class="ev"><span>' + esc(z.name) + "</span><dl>" +
        "<div><dt>60 日比其他板塊</dt><dd class=\"" + dir(a.avg_rel) + "\">" + num(a.avg_rel, 1, "%") + "<small>中位 " + num(a.med_rel, 1, "%") + "</small></dd></div>" +
        "<div><dt>60 日勝率</dt><dd>" + plain(a.win, 0, "%") + "</dd></div>" +
        "<div><dt>120 日比其他板塊</dt><dd class=\"" + dir(b.avg_rel) + "\">" + num(b.avg_rel, 1, "%") + "<small>中位 " + num(b.med_rel, 1, "%") + "</small></dd></div>" +
        "<div><dt>樣本</dt><dd>" + a.n + "</dd></div></dl></div>";
    }
    var cls = { "景氣上行確認": "s0", "營收轉強、股價未齊漲": "s1", "股價齊漲、營收未跟上": "s2", "—": "s3" };
    var cards = C.now.map(function (t) {
      var h = (t.y3m || []).filter(function (v) { return v != null; });
      return '<article class="pc"><h4><a href="sectors.html#' + esc(t.id) + '">' + esc(t.name) + '</a><span class="st2 ' + cls[t.state] + '">' + esc(t.state === "—" ? "無訊號" : t.state) + "</span></h4>" +
        '<div class="kpi"><div><span>產業營收年增</span><b class="' + dir(t.rev_y3) + '">' + num(t.rev_y3, 0, "%") + "</b></div>" +
        "<div><span>較 3 月前</span><b class=\"" + dir(t.rev_acc) + "\">" + num(t.rev_acc, 0, "pt") + "</b></div>" +
        "<div><span>成員年增≥20%</span><b>" + plain(t.rev_breadth, 0, "%") + "</b></div>" +
        "<div><span>近 52 週高</span><b>" + plain(t.price_breadth, 0, "%") + "</b></div></div>" +
        '<p class="note">近 60 日板塊漲跌 ' + num(t.ret60, 1, "%") + (h.length ? " · 近一年產業營收年增(3 月平均):" + h.map(function (v) { return Math.round(v); }).join(" → ") + "%" : "") + "</p></article>";
    }).join("");
    var cases = C.cases.slice(0, 14).map(function (c) {
      function cell(x) { return x ? MR.md(x.date) + " · 已漲 " + num(x.at, 0, "%") + " · 之後 " + num(x.left, 0, "%") : '<span style="color:var(--faint)">沒抓到</span>'; }
      return "<tr><td>" + esc(c.name) + "</td><td>" + MR.md(c.trough) + " → " + MR.md(c.peak) + '</td><td class="up">' + num(c.gain, 0, "%") + "</td><td>" + cell(c.rev_up) + "</td><td>" + cell(c.both) + "</td></tr>";
    }).join("");
    return '<div class="sec-h"><h2>產業循環 · 抓整個產業的漲價行情</h2><p>記憶體、被動元件這類行情是整個產業一起動。沒有產品報價資料,改看兩件公開資料:板塊內公司的營收是否一起轉強、股價是否一起創新高。</p></div>' +
      '<div class="evi">' + st("both") + st("rev_up") + st("rally") + "</div>" +
      '<p class="note">「營收轉強」= 板塊同口徑營收 3 個月平均年增 ≥ 15%、比 3 個月前高 10 個百分點以上,且過半成員年增 ≥ 20%。「齊漲」= 過半成員在 52 週高點 5% 內且板塊指數創新高。兩者在 60 日內都出現 = 景氣上行確認。只有 31 個板塊,樣本少,統計上不如個股名單可靠:2023–2026 AI 行情期間效果很強(60 日比其他板塊 +25%),但 2019–2023 只剩 +5.7%、中位數為負;而且板塊清單是現在定的,有後見之明。</p>' +
      '<div class="cy">' + cards + "</div>" +
      '<div class="box"><h3>歷史大行情回顧:訊號在什麼時候出現</h3><table class="pf"><thead><tr><th>板塊</th><th>低點 → 高點</th><th>漲幅</th><th>營收轉強</th><th>營收轉強 + 齊漲</th></tr></thead><tbody>' + cases + "</tbody></table>" +
      "<p>漲幅是板塊等權指數。「已漲」= 訊號出現時已從低點漲多少,「之後」= 訊號出現後到高點還剩多少。2025 年 4 月關稅急跌後的全面反彈多數抓不到,因為那是大盤行情,不是產業景氣。</p></div>";
  }

  function auditBox() {
    if (!AU) return "";
    function one(x, label) {
      if (!x) return "";
      if (x.status !== "ok") return "<tr><td>" + label + "</td><td colspan=\"4\">" + esc(x.status) + "(目前 " + x.n + " 籃,至少要 " + (x.need || 10) + " 籃才送檢)</td></tr>";
      return "<tr><td>" + label + "</td><td>" + esc(x.headline.split(":")[0]) + "</td><td>" + x.n + " 籃 · 勝率 " + plain(x.win_rate * 100, 0, "%") + "</td><td>每籃平均 " + num(x.expectancy / 1e4, 1, "%") +
        "</td><td>p = " + (x.p_t < 0.001 ? "&lt;0.001" : x.p_t.toFixed(3)) + (x.oos_persisted ? " · 樣本外延續" : "") + "</td></tr>";
    }
    return '<div class="box"><h3>第三方稽核:anti-gambling-trader</h3><table class="pf"><tbody>' +
      one(AU.live, "實盤追蹤(真正的檢驗)") + one(AU.backtest, "回測(規則是事後訂的,僅供參考)") + "</tbody></table>" +
      "<p>每週自動把「營收動能名單每月一籃、持有 20 日、扣掉同日一般股報酬」的紀錄,交給開源的交易統計檢驗工具 " +
      '<a href="https://github.com/mars-tw/anti-gambling-trader-tw" style="color:var(--accent)">anti-gambling-trader</a>(固定版本 ' + esc((AU.tool_sha || "").slice(0, 7)) +
      ")判定是實力還是運氣。我們驗證過:把隨機選股丟給它,40 次沒有一次被判「具統計優勢」。最近稽核 " + esc(AU.generated_at.slice(0, 10)) + "。</p></div>";
  }

  function trackView() {
    if (!TK) return '<p class="note">實績資料尚未產生。</p>';
    var rows = Object.keys(TK.lists).map(function (k) {
      var v = TK.lists[k];
      function cell(h) { var x = v["avg_x" + h]; return '<td class="' + dir(x) + '">' + (x == null ? "累積中" : sign(x, 2) + "%") + '<br><small style="color:var(--faint)">' + v["n" + h] + " 天</small></td>"; }
      return "<tr><td>" + esc(v.name) + "</td>" + cell(5) + cell(20) + cell(60) + "</tr>";
    }).join("");
    return auditBox() + '<div class="sec-h"><h2>實績追蹤</h2><p>從 ' + esc(TK.since) + " 起,每個交易日把當天的名單存下來(之後不會修改),再用之後的實際股價結算。這是唯一不能事後挑選的成績單。</p></div>" +
      '<div class="tkwrap"><table class="tk"><thead><tr><th>名單</th><th>5 日後比一般股</th><th>20 日後比一般股</th><th>60 日後比一般股</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<p class="note">「比一般股」= 名單內個股隔天開盤買進、持有 N 日的平均報酬,減掉同一天所有可交易股票的平均,已扣交易成本。剛開始記錄時樣本很少,數字波動會很大,至少累積數個月再判斷。</p>';
  }

  function render() {
    app.innerHTML =
      '<div class="status"><span>資料日 <b>' + esc(R.date) + '</b></span><span class="sep"></span><span>最新營收月份 <b>' + esc(R.rev_latest) + "</b></span>" +
      '<span class="sep"></span><span id="live-status">' + MR.liveStatus(LIVE, R.date) + "</span></div>" +
      verdict() +
      '<div class="tabs"><div class="seg" role="tablist" aria-label="檢視">' +
      [["rank", "潛在排行"], ["rev", "營收動能 · 爆發前"], ["cycle", "產業循環"], ["breakout", "爆量突破 · 剛爆發" + (LIVEHITS.length ? " +" + LIVEHITS.length : "")], ["track", "實績追蹤"]].map(function (o) {
        return '<button type="button" role="tab" data-view="' + o[0] + '" aria-pressed="' + (o[0] === view) + '" aria-selected="' + (o[0] === view) + '">' + o[1] + "</button>";
      }).join("") + "</div></div>" +
      (view === "rank" ? rankView() : view === "rev" ? revView() : view === "cycle" ? cycleView() : view === "breakout" ? boView() : trackView());
    if (LIVE) MR.patchPrices(app, LIVE);
    document.title = "起漲雷達 · " + R.date;
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-view],[data-sort],[data-all],[data-rf],[data-rs]");
    if (!b) return;
    if (b.dataset.view) { view = b.dataset.view; history.replaceState(null, "", "#" + view); }
    if (b.dataset.sort) sortBy = b.dataset.sort;
    if (b.dataset.rf) rankFilter = b.dataset.rf;
    if (b.dataset.rs) rankSort = b.dataset.rs;
    if (b.dataset.all) showAll[b.dataset.all] = !showAll[b.dataset.all];
    render();
  });
  app.addEventListener("change", function (e) {
    var o = e.target.dataset && e.target.dataset.opt;
    if (o === "hideLow") { hideLow = e.target.checked; try { localStorage.setItem("radar.hideLow", hideLow ? "1" : "0"); } catch (x) {} }
    if (o === "onlyNew") onlyNew = e.target.checked;
    if (o) render();
  });

  Promise.all([MR.json("data/radar/latest.json"), MR.json("data/track/summary.json").catch(function () { return null; }),
    MR.json("data/track/audit.json").catch(function () { return null; }),
    MR.json("data/radar/fv_backtest.json").catch(function () { return null; })])
    .then(function (r) {
      R = r[0]; TK = r[1]; AU = r[2]; FVT = r[3];
      render();
      // 證交所若已公布比網站更新的收盤資料,直接在瀏覽器更新上市股價格並判斷今日突破
      return MR.fetchLive(R.date).then(function (lv) {
        if (!lv) return;
        LIVE = lv;
        return MR.json("data/radar/live.json").then(function (th) {
          LIVEHITS = MR.liveBreakouts(lv, th);
          render();
        }).catch(function () { render(); });
      });
    })
    .catch(function () { app.innerHTML = '<p class="err">起漲雷達資料尚未產生。</p>'; });
})();
</script>
</body>
</html>
