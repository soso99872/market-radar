                - heading "科磊供應警訊引爆AI晶片股全面拋售,費半創波段最大單日跌幅 利空" [level=3] [ref=f1e250]:
                  - text: 科磊供應警訊引爆AI晶片股全面拋售,費半創波段最大單日跌幅
                  - generic [ref=f1e251]: 利空
                - paragraph [ref=f1e252]: 晶圓設備廠科磊(Lam Research)釋出供應受限的保守展望,觸發AI晶片供應鏈全面殺盤:Marvell、AMD盤中跌約8%,英特爾跌約7%,科磊本身重挫約9%,費城半導體指數單日重挫6.06%,為6月下旬以來最大單日跌幅;那斯達克綜合指數跌2.44%,創6月以來最差單日表現。市場同時對AI資本支出能否帶來對等回報的疑慮再度升溫。若今日台北開盘後,AI供應鏈情緒延續偏空,台股晶圓代工、ASIC、AI伺服器等出口相關個股恐面臨補跌壓力;若美股尾盤止穩或出現逢低買盤,台股跌幅則可能收斂。
                - generic [ref=f1e253]:
                  - generic [ref=f1e254]: 美股
                  - generic [ref=f1e255]: 半導體
                  - generic [ref=f1e256]: AI伺服器
                  - generic [ref=f1e257]: ASIC 與矽智財
            - listitem [ref=f1e258]:
