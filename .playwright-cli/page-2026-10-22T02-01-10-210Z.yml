                  - generic [ref=e291]: 視數據而定
                - paragraph [ref=e292]: 美元指數10/20下跌0.23%至101.742,但美元兌新台幣同步走升0.78%至32.641,新台幣對美元走貶,與美元指數走勢背離,可能反映外資匯出或台股資金流出壓力。新台幣若延續貶勢,理論上有利電子代工、傳產出口商的匯兌收益,但也可能加重外資持有台股的匯損顧慮,進而影響外資加碼意願。
