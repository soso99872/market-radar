                  - generic [ref=e308]: 記憶體
            - listitem [ref=e309]:
              - generic [ref=e311]:
                - heading "台積電Q3營收、淨利雙創新高且優於財測上緣,但資本支出與AI估值疑慮下ADR仍隨大盤重挫 視數據而定" [level=3] [ref=e312]:
                  - text: 台積電Q3營收、淨利雙創新高且優於財測上緣,但資本支出與AI估值疑慮下ADR仍隨大盤重挫
                  - generic [ref=e313]: 視數據而定
                - paragraph [ref=e314]: 台積電10/15法說會公布Q3營收446.72億美元,較財測上緣(458億美元)再高出約2%,歸屬母公司淨利年增68.7%,毛利率66.4%落在財測區間(65%~67%)內;Q4營收展望維持強勁成長,全年資本支出指引維持在600億至640億美元區間、未進一步上修。儘管財報與展望均優於市場預期,但法人關注資本支出持續擴大對毛利率的稀釋風險,加上同日美股AI供應鏈信心受CoreWeave事件衝擊,台積電ADR當日(10/16)仍下跌2.28%,顯示財報雖佳但未能抵銷整體半導體股的系統性賣壓。
                - generic [ref=e315]:
