                  - text: 三大法人昨賣超台股963.6億元
                  - generic [ref=e262]: 利空
                - paragraph [ref=e263]: 證交所資料顯示,10/20三大法人合計賣超963.6億元,其中外資賣超795.4億元、自營商賣超355.79億元,僅投信逆勢買超187.59億元。外資與自營商同步調節,顯示短線籌碼面轉向保守,若賣壓延續,台股開盤及盤中恐承受較大賣壓;若轉為買超則可視為籌碼面轉強的訊號。
                - generic [ref=e264]: 台股
            - listitem [ref=e266]:
              - generic [ref=e268]:
                - heading "半導體供應鏈資金全面撤出,防禦與傳產板塊吸金 視數據而定" [level=3] [ref=e269]:
                  - text: 半導體供應鏈資金全面撤出,防禦與傳產板塊吸金
                  - generic [ref=e270]: 視數據而定
                - paragraph [ref=e271]: 板塊資金流向資料顯示,晶圆代工、IC設計分別連續10日資金淨流出(20日累計淨賣超2600億元、1005億元),矽晶圓、記憶體、半導體設備等上下游同步遭調節,台積電、聯電為主要調節標的;相對地,電信已連續14日資金淨流入(20日淨買超180億元,全市場31個板塊排名第1)、鋼鐵連8日淨流入(淨買超69億元),顯示法人短線轉向防禦與傳產類股。若半導體資金持續外流,台股權值股恐持續承壓;若轉為回補則有助指數止穩。
                - generic [ref=e272]:
