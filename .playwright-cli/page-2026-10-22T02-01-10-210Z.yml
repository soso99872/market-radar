                - heading "美股財報優於預期挺盤,道瓊漲近1% 視數據而定" [level=3] [ref=e250]:
                  - text: 美股財報優於預期挺盤,道瓊漲近1%
                  - generic [ref=e251]: 視數據而定
                - paragraph [ref=e252]: 美股10/20道瓊大漲507點(+0.98%),主因3M、諾斯洛普格魯曼等工業股財報優於預期並上修展望,帶動資金轉向傳產與醫療保健等防禦類股;那指幾近平盤(+0.22%)、費半僅溫和上漲(+0.22%),輝達、微軟等AI權值股同步走弱,顯示資金出現從AI/科技股輪動至財報優異的傳統產業的跡象。若這一輪動持續,台股的電子權值股可能較難直接受惠於美股這波上漲。
                - generic [ref=e253]:
