name: 行情與法人資料

on:
  schedule:
    - cron: "15 22 * * 0-4"   # 台北 06:15(週一至週五):隔夜美股行情 + 前一交易日法人,給 07:30 晨報用
    - cron: "40 9 * * 1-5"    # 台北 17:40(週一至週五):當日法人買賣超,更新板塊資金頁
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-data.yml
      - scripts/fetch_flows.py
      - scripts/fetch_quotes.py
      - data/sectors/themes.json

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - name: 抓行情
        run: |
          python scripts/fetch_quotes.py > /tmp/quotes.json && mv /tmp/quotes.json data/quotes.json || echo "::warning::fetch_quotes 失敗"
      - name: 抓法人買賣超並計算板塊
        run: python scripts/fetch_flows.py || echo "::warning::fetch_flows 失敗"
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每次都疊在最新的 main 上,只提交本流程負責的檔案,避免和晨報或其他執行互相覆蓋
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            git add -A data/quotes.json data/flows data/sectors/latest.json
            if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
            git commit -q -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
