                - paragraph [ref=e283]: WTI原油10/20重挫5.37%至每桶98.09美元,為近期單日最大跌幅之一;美債10年期殖利率同步小跌0.08個百分點。若油價回落趨勢延續,有助緩解通膨壓力、支撐降息預期,對成長股估值偏正面;但若反映的是市場對需求轉弱的擔憂,則可能是風險情緒轉弱的訊號,需留意後續油價與經濟數據是否一致。
