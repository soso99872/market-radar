<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">

<style>
main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.status b { font-family: var(--mono); font-weight: 600; color: var(--text); }
.status .sep { width: 1px; height: 12px; background: var(--line); }
.status .seg { margin-left: auto; }
.howto { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--muted); }
.howto summary { cursor: pointer; color: var(--text); font-weight: 700; }
.howto ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.howto b { color: var(--text); }
.base { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: 14px; color: var(--muted); padding: 2px 2px; }
.base b { font-family: var(--mono); color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 17px; font-weight: 900; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.card .desc { margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.big span { display: block; font-size: 12px; color: var(--muted); }
.big b { font-family: var(--mono); font-size: 22px; font-weight: 600; }
.big small { display: block; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.winbar { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin: -2px 0 12px; }
.winbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.winbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); text-decoration: none; }
table.split { border-collapse: collapse; width: 100%; font-size: 13px; }
.split th { text-align: right; font-weight: 500; color: var(--faint); padding: 4px; border-bottom: 1px solid var(--line); }
.split th:first-child, .split td:first-child { text-align: left; }
.split td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; }
.split td:first-child { font-family: var(--sans); color: var(--muted); }
.split tr:last-child td { border-bottom: 0; }
.hits { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.hits h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); letter-spacing: .1em; font-weight: 700; }
.hit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; width: 100%; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.hit:last-child { border-bottom: 0; }
button.hit { background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; color: inherit; }
button.hit:hover, a.hit:hover { background: var(--panel-2); }
.hit .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit .nm b { font-family: var(--mono); margin-right: 6px; }
.hit .v { font-family: var(--mono); text-align: right; white-space: nowrap; font-size: 13px; }
.more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0 0; font-size: 13px; }
.none { font-size: 13px; color: var(--faint); margin: 0; }
.grp { margin: 8px 0 -4px; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.grp small { letter-spacing: 0; font-weight: 400; margin-left: 8px; color: var(--faint); }
.benchnote { font-size: 12px; color: var(--faint); margin: -8px 0 10px; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <svg class="sp-logo" viewBox="0 0 64 64" width="96" height="96">
      <defs><linearGradient id="spsw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e7b04a" stop-opacity="0"/><stop offset="1" stop-color="#f3c96b" stop-opacity=".95"/></linearGradient></defs>
      <circle cx="32" cy="32" r="21" fill="none" stroke="#2c3647" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="12" fill="none" stroke="#2c3647" stroke-width="1.6"/>
      <g class="sp-sweep"><path d="M32 32 L32 11 A21 21 0 0 1 51.2 23.4 Z" fill="url(#spsw)"/><line x1="32" y1="32" x2="51.2" y2="23.4" stroke="#f3c96b" stroke-width="1.6" stroke-linecap="round"/></g>
      <circle class="sp-blip" cx="44" cy="20.5" r="2.6" fill="#fff"/>
      <circle cx="32" cy="32" r="2.2" fill="#f3c96b"/>
    </svg>
    <div class="sp-name">盤前雷達</div>
    <div class="sp-tag">營收 · 動能 · 題材 ── 每個交易日 06:00 更新</div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true" class="logo">
        <defs><linearGradient id="lgsw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e7b04a" stop-opacity="0"/><stop offset="1" stop-color="#f3c96b" stop-opacity=".95"/></linearGradient></defs>
        <rect width="64" height="64" rx="15" fill="#121926"/>
        <circle cx="32" cy="32" r="21" fill="none" stroke="#2c3647" stroke-width="3"/>
        <circle cx="32" cy="32" r="12" fill="none" stroke="#2c3647" stroke-width="3"/>
        <path d="M32 32 L32 11 A21 21 0 0 1 51.2 23.4 Z" fill="url(#lgsw)"/>
        <circle cx="44" cy="20.5" r="3.4" fill="#fff"/>
        <circle cx="32" cy="32" r="3" fill="#f3c96b"/>
      </svg>
      <div><b>盤前雷達</b><br><span>台美股 · 每個交易日 06:00</span></div>
    </a>
    <nav class="nav" aria-label="頁面">
      <a href="./">晨報</a>
      <a href="sectors.html">板塊資金</a>
      <a href="radar.html">起漲雷達</a>

      <a href="strategy.html">策略績效</a>

    </nav>
    <div class="seg" role="group" aria-label="漲跌顏色">
      <button type="button" id="conv-tw" aria-pressed="true">紅漲綠跌</button>
      <button type="button" id="conv-us" aria-pressed="false">綠漲紅跌</button>
    </div>
  </div>
</header>

<main id="app"><div class="skel" aria-busy="true" aria-label="載入中"><i></i><i></i><i></i><i></i></div></main>

<footer>
  回測使用證交所與櫃買中心公開的個股日資料。歷史表現不代表未來結果;訊號統計是所有個股的平均表現,不是對任何個股的預測。本頁只呈現事實,不構成任何投資建議。
</footer>

<script src="assets/common.js"></script>
<script src="assets/live.js"></script>
<script>
(function () {
  "use strict";
  var esc = MR.esc, pct = MR.pct, sign = MR.sign, dir = MR.dir;
  var app = document.getElementById("app");
  var ST = null, TD = null, h = "10", expanded = {};
  var ORDER = { "強": 0, "中": 1, "反向": 2, "弱": 3, "樣本不足": 4 };
  MR.setupConv();

  function exCell(x, baseWin) {
    if (!x || !x.n) return "<td>—</td><td>—</td><td>—</td><td>0</td>";
    return '<td class="' + dir(x.win - baseWin) + '">' + x.win.toFixed(1) + "%</td>" +
      '<td class="' + dir(x.avg_rel) + '">' + sign(x.avg_rel, 2) + "%</td>" +
      "<td>" + x.win_mkt.toFixed(1) + "%</td><td>" + x.n.toLocaleString("en-US") + "</td>";
  }

  function card(id, s) {
    var hz = s.horizons[h], a = hz.all, base = ST.baseline[h] || {};
    if (!a || !a.n) return "";
    var watch = s.group === "watch";
    var hits = watch ? [] : id === "sector_flip" ? (TD.sector_flips || []) : ((TD.hits || {})[id] || []);
    var shown = expanded[id] ? hits : hits.slice(0, 8);
    var bw = base.win || 50, winCol = a.win >= bw ? "var(--up)" : "var(--down)";
    var hitHtml = id === "sector_flip"
      ? (hits.length ? hits.map(function (x) {
          return '<a class="hit" href="sectors.html#' + esc(x.id) + '" style="text-decoration:none"><span class="nm">' + esc(x.name) +
            '</span><span class="v">5 日 ' + MR.yi(x.net5) + '</span><span class="v"></span></a>';
        }).join("") : '<p class="none">今日沒有板塊翻正。</p>')
      : (hits.length ? shown.map(function (x) {
          return '<button type="button" class="hit stock-link" data-stock="' + esc(x.code) + '"><span class="nm"><b>' + esc(x.code) + "</b>" + esc(x.name) +
            '</span><span class="v">' + pct(x.chg) + '</span><span class="v">' + MR.yi(x.net) + "</span></button>";
        }).join("") + (hits.length > 8 ? '<button type="button" class="more" data-more="' + id + '">' +
          (expanded[id] ? "收合" : "顯示全部 " + hits.length + " 檔") + "</button>" : "")
        : '<p class="none">今日沒有個股觸發。</p>');
    return '<section class="card"><h2>' + esc(s.name) + MR.gradeTag(hz.grade) + "</h2>" +
      '<p class="desc">' + esc(s.desc) + "</p>" +
      (s.bench === "members" ? '<p class="benchnote">比較基準:所有板塊成分股平均(扣除板塊清單的後見之明)</p>' : "") +
      '<div class="big">' +
      "<div><span>" + h + ' 日勝過一般個股</span><b style="color:' + winCol + '">' + a.win.toFixed(1) + "%</b><small>基準 " + bw.toFixed(1) + "%</small></div>" +
      "<div><span>平均相對報酬</span><b class=\"" + dir(a.avg_rel) + '">' + sign(a.avg_rel, 2) + "%</b><small>中位數 " + sign(a.med_rel, 2) + "%</small></div>" +
      "<div><span>樣本數</span><b>" + a.n.toLocaleString("en-US") + "</b><small>t = " + a.t.toFixed(1) + "</small></div></div>" +
      '<div class="winbar" title="勝率與 95% 信賴區間;白線為基準"><i style="left:' + (a.win_ci[0] || 0) + "%;width:" + ((a.win_ci[1] || 0) - (a.win_ci[0] || 0)) +
      "%;background:" + winCol + ';opacity:.8"></i><u style="left:' + bw + '%"></u></div>' +
      '<table class="split"><thead><tr><th></th><th>勝過一般股</th><th>平均相對</th><th>跑贏大盤</th><th>樣本</th></tr></thead><tbody>' +
      "<tr><td>全期間</td>" + exCell(a, bw) + "</tr>" +
      "<tr><td>樣本外(近一年)</td>" + exCell(hz.oos, bw) + "</tr>" +
      (hz.bull ? "<tr><td>大盤多頭時</td>" + exCell(hz.bull, bw) + "</tr>" : "") +
      (hz.bear ? "<tr><td>大盤空頭時</td>" + exCell(hz.bear, bw) + "</tr>" : "") +
      "</tbody></table>" +
      (watch ? '<div class="hits"><a class="more" href="watch.html">到觀察名單看今日符合的個股 →</a></div></section>'
        : '<div class="hits"><h3>' + (id === "sector_flip" ? "今日翻正的板塊" : "今日觸發 · " + hits.length + " 檔") + "</h3>" + hitHtml + "</div></section>");
  }

  function render() {
    function sorted(list) {
      return list.sort(function (x, y) {
        var a = ST.signals[x].horizons[h], b = ST.signals[y].horizons[h];
        return (ORDER[a.grade] - ORDER[b.grade]) || ((b.all.avg_rel || 0) - (a.all.avg_rel || 0));
      });
    }
    var all = Object.keys(ST.signals);
    var ev = sorted(all.filter(function (k) { return ST.signals[k].group !== "watch"; }));
    var wl = sorted(all.filter(function (k) { return ST.signals[k].group === "watch"; }));
    var base = ST.baseline[h] || {};
    app.innerHTML =
      '<div class="status"><span>回測期間 <b>' + esc(ST.span[0]) + " ～ " + esc(ST.span[1]) + "</b>(" + ST.days + ' 個交易日)</span><span class="sep"></span>' +
      "<span>目前大盤 <b>" + esc(ST.regime_now) + '</b></span><span class="sep"></span><span>今日訊號 <b>' + esc(TD.date) + "</b></span>" +
      '<div class="seg" role="group" aria-label="持有天數">' + ["5", "10", "20"].map(function (k) {
        return '<button type="button" data-h="' + k + '" aria-pressed="' + (k === h) + '">持有 ' + k + " 日</button>";
      }).join("") + "</div></div>" +
      '<details class="howto"><summary>怎麼讀這頁</summary><ul>' +
      "<li><b>勝過一般個股</b>:訊號出現後,隔天開盤買進、持有 " + h + " 天後收盤賣出(已扣 " + ST.cost_pct.toFixed(3) + "% 交易成本),報酬高於同一天所有流動股平均的比例。這把大盤漲跌和權值股的影響扣掉,直接回答「這個訊號挑出的股票有沒有比隨便挑好」。</li>" +
      "<li><b>基準</b>:隨便挑一檔流動股(近 20 日均成交 ≥ 1 億)勝過平均的比例。因為少數大漲股會把平均拉高,這個基準通常低於 50%;訊號要明顯高於基準才有意義。</li>" +
      "<li><b>平均相對報酬</b>:比同日一般個股平均多賺(或少賺)多少。基準是 0。</li>" +
      "<li><b>跑贏大盤</b>:報酬高於同期加權指數的比例,供參考。加權指數受台積電影響很大,大型權值股強勢的期間,大部分個股都很難跑贏。</li>" +
      "<li><b>樣本外(近一年)</b>:最近 250 個交易日的表現。全期間好、近一年也好,才比較不像是巧合。</li>" +
      "<li><b>證據強度</b>:強 = t ≥ 3.5、平均多 0.3% 以上且近一年同方向;中 = t ≥ 2.5 且近一年同方向;反向 = t ≤ −2.5 且近一年同方向。同時檢驗數十個條件,門檻依多重比較拉高,避免把運氣誤認成優勢。觀察名單與起漲雷達的條件是看過這段資料後才定的,近一年不算真正的樣本外,請以起漲雷達頁的「實績追蹤」為準;弱 = 看不出差別;樣本不足 = 少於 30 次。t 值以「每天的平均相對報酬」計算並用 Newey-West 修正持有期重疊,避免同一天大量個股同時觸發造成樣本數虛胖。</li>" +
      "<li><b>平均 vs 中位數</b>:幾乎所有訊號的平均為正、中位數為負,代表報酬靠少數大漲股撐起來,多數時候單一個股仍會輸。這是籌碼訊號的常態,所以要分散與控制部位。</li>" +
      "<li><b>限制</b>:只含目前仍掛牌的股票(已下市的不在資料內,結果偏樂觀);沒有排除隔天漲停買不到的情況;板塊分類是用現在的成分股回推。</li>" +
      "<li>這些是<b>機率</b>,不是保證。同一個訊號在個別股票上的結果差異很大,請搭配停損與部位控管。</li></ul></details>" +
      '<div class="base">基準(任一流動股,持有 ' + h + " 日):勝過一般個股 <b>" + (base.win || 0).toFixed(1) + "%</b> · 跑贏大盤 <b>" + (base.win_mkt || 0).toFixed(1) +
      "%</b> · 樣本 <b>" + (base.n || 0).toLocaleString("en-US") + "</b></div>" +
      '<h2 class="grp">事件訊號<small>觸發當天記一次</small></h2>' +
      '<div class="cards">' + ev.map(function (id) { return card(id, ST.signals[id]); }).join("") + "</div>" +
      (wl.length ? '<h2 class="grp">觀察名單的篩選條件<small>每天符合就記一筆,用來檢驗觀察名單有沒有根據</small></h2>' +
        '<div class="cards">' + wl.map(function (id) { return card(id, ST.signals[id]); }).join("") + "</div>" : "");
    document.title = "訊號回測 · " + TD.date;
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-h],[data-more]");
    if (!b) return;
    if (b.hasAttribute("data-h")) h = b.getAttribute("data-h");
    if (b.hasAttribute("data-more")) { var k = b.getAttribute("data-more"); expanded[k] = !expanded[k]; }
    render();
  });

  Promise.all([MR.stats(), MR.json("data/signals/today.json")])
    .then(function (r) {
      ST = r[0]; TD = r[1];
      if (!ST) throw new Error("no stats");
      render();
    })
    .catch(function () { app.innerHTML = '<p class="err">回測資料尚未產生。</p>'; });
})();
</script>
</body>
