<style>
main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.status b { font-family: var(--mono); font-weight: 600; color: var(--text); }
.status .sep { width: 1px; height: 12px; background: var(--line); }
.tabs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tabs .seg button { height: 34px; padding: 0 14px; font-size: 14px; }
.verdict { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 12px 16px; }
.verdict h2 { margin: 0 0 6px; font-size: 15px; font-weight: 900; }
.verdict ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.verdict b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.verdict .k { color: var(--text); font-family: var(--sans); font-weight: 700; }
.verdict details { margin-top: 8px; font-size: 13px; color: var(--muted); }
.verdict summary { cursor: pointer; color: var(--text); }
.verdict details ul { margin-top: 6px; font-size: 13px; }

.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 4px 0 -4px; }
.sec-h h2 { margin: 0; font-size: 18px; font-weight: 900; }
.sec-h p { margin: 0; font-size: 13px; color: var(--muted); }
.evi { display: flex; flex-wrap: wrap; gap: 8px; }
.evi div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 13px; color: var(--muted); min-width: 0; flex: 1 1 260px; }
.evi div > span { display: block; color: var(--text); font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
.evi b { font-family: var(--mono); font-weight: 600; }

.tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - var(--bar-h, 110px) - 24px); scroll-margin-top: calc(var(--bar-h, 110px) + 12px); }
.tablewrap thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); }
table.th { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 860px; }
.th th { font-size: 12px; color: var(--faint); font-weight: 500; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.th th.l, .th td.l { text-align: left; }
.th td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); white-space: nowrap; }
.th tr:last-child td { border-bottom: 0; }
.th td.nm { font-family: var(--sans); font-weight: 700; }
.th td.nm a { text-decoration: none; }
.th td.nm a:hover { color: var(--accent); }
.th td.rk { color: var(--faint); width: 36px; }
.th td.read { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.th tr.bot td { background: color-mix(in srgb, var(--down) 6%, transparent); }
.spark { display: block; }
.st { display: inline-block; font-family: var(--sans); font-size: 12px; font-weight: 700; border-radius: 4px; padding: 0 7px; }
.st.in { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }
.st.out { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
.st.mid { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
.st.bad { color: var(--down); border: 1px solid color-mix(in srgb, var(--down) 50%, transparent); margin-left: 4px; }

.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; align-items: start; }
.pc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.pc-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pc-h .stock-link { font-size: 16px; font-weight: 900; }
.pc-h .stock-link b { font-family: var(--mono); margin-right: 6px; }
.pc-h .px { font-family: var(--mono); margin-left: auto; font-size: 14px; }
.stage { font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 0 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.stage.go { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.kpi div { background: var(--panel-2); padding: 4px 8px; min-width: 0; }
.kpi span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; }
.kpi b { font-family: var(--mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.why { margin: 0; padding-left: 1.1em; font-size: 13.5px; display: grid; gap: 2px; }
.why.risk { color: var(--amber); margin-top: 4px; list-style: "⚠ "; }
.pc .chips { margin-top: 8px; }
.more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 14px; justify-self: start; }
.note { font-size: 12.5px; color: var(--faint); margin: 0; }
.blk { display: grid; gap: 10px; }
@media (max-width: 420px) { .kpi { grid-template-columns: repeat(2, 1fr); } }
</style>

<footer>
  名單是依公開的法人買賣超、股價與基本面資料,用固定規則篩出來的,每個交易日收盤後更新;不是買賣建議,也不代表會漲或會跌。
  每一項條件都附上 2019 年以來的回測結果,歷史表現不代表未來。本益比與月營收只有最新一期,沒有經過回測,僅供參考。
</footer>

<script src="assets/common.js"></script>
<script src="assets/live.js"></script>
<script>
(function () {
  "use strict";
  var esc = MR.esc, pct = MR.pct, sign = MR.sign, dir = MR.dir;
  var app = document.getElementById("app");
  var W = null, ST = null, LIVE = null;
  var view = (location.hash || "#trend").slice(1), stage = "all", sortBy = "flow", showAll = {};
  if (["trend", "picks", "risk"].indexOf(view) < 0) view = "trend";
  MR.setupConv();

  function hz(id) { return ST && ST.signals[id] ? ST.signals[id].horizons["20"] : null; }

  // 一行回測摘要
  function evi(id, label) {
    var z = hz(id);
    if (!z || !z.all.n) return "";
    var a = z.all, o = z.oos;
    return "<div><span>" + esc(label || ST.signals[id].name) + MR.gradeTag(z.grade) + "</span>" +
      "20 日平均比同類 <b class=\"" + dir(a.avg_rel) + "\">" + sign(a.avg_rel, 2) + "%</b>" +
      " · 中位數 <b>" + sign(a.med_rel, 2) + "%</b>" +
      " · 近一年 <b class=\"" + dir(o.avg_rel) + "\">" + sign(o.avg_rel, 2) + "%</b></div>";
  }

  function lag(v) { return (v < 0 ? "落後同類 <b>" : "領先同類 <b>") + Math.abs(v).toFixed(2) + "%</b>"; }

  function num(v, d, suf) { return v == null ? "—" : sign(v, d) + (suf || ""); }

  function verdict() {
    var p = hz("w_pick"), q = hz("w_pick_quiet"), m = hz("w_pick_moving"), b = hz("w_theme_bottom"),
      d = hz("w_dump"), a = hz("accum"), s = hz("w_stretch");
    if (!p) return "";
    var li = [];
    if (a) li.push("<span class=\"k\">「大戶默默布局、股價還沒發動」用籌碼找不太出來。</span>近 20 日法人持續買、股價卻還沒動的股票,之後 20 天平均只比同類多 <b>" +
      sign(a.all.avg_rel, 2) + "%</b>,近一年 <b>" + sign(a.oos.avg_rel, 2) + "%</b>(證據:" + esc(a.grade) + ")。");
    if (q && m) li.push("<span class=\"k\">資金流入的板塊裡,法人重押的股票" + (m.all.avg_rel > q.all.avg_rel ? "「已發動」的反而比「未發動」好" : "「未發動」的比「已發動」好") +
      "</span>:已發動 <b>" + sign(m.all.avg_rel, 2) + "%</b>、未發動 <b>" + sign(q.all.avg_rel, 2) + "%</b>(20 日平均比同類)。趨勢延續比提前埋伏更有根據。");
    if (b && d) li.push("<span class=\"k\">籌碼最有用的是告訴你避開什麼。</span>資金排名墊底的板塊,成分股 20 日平均" + lag(b.all.avg_rel) +
      ";法人持續調節的個股" + lag(d.all.avg_rel) + (b.oos.avg_rel < 0 && d.oos.avg_rel < 0 ? ",而且近一年同樣成立。" : "。近一年方向不一致,要保守看待。"));
    if (s) li.push("<span class=\"k\">漲多不等於會跌。</span>高於季線 50% 以上的股票平均仍 <b>" + sign(s.all.avg_rel, 2) + "%</b>,但中位數 <b>" +
      sign(s.all.med_rel, 2) + "%</b>:多數會回檔、少數繼續噴,風險在波動,不在方向。");
    li.push("<span class=\"k\">幾乎所有條件的中位數都是負的</span>:就算是有根據的名單,單一個股多數時候仍會輸,平均報酬靠少數大漲股撐起來。分散持有與停損比挑對一檔更重要。");
    return '<section class="verdict"><h2>先看結論:用 2019 年以來的資料驗證過的事</h2><ul><li>' + li.join("</li><li>") + "</li></ul>" +
      "<details><summary>名單怎麼來、哪些沒驗證過</summary><ul>" +
      "<li>板塊資金:板塊內所有成分股三大法人買賣超加總,看 20 日與 5 日方向;排名用「20 日買賣超 ÷ 成交金額」,避免大型板塊天生數字大。</li>" +
      "<li>比較基準:板塊類條件跟「所有板塊成分股平均」比,個股條件跟「所有流動股平均」比。板塊清單是現在定的,事後看本來就偏向強勢產業,直接跟全市場比會高估。</li>" +
      "<li>回測假設:收盤後才知道、隔天開盤買、持有 20 個交易日、扣交易成本 " + (ST.cost_pct || 0).toFixed(3) + "%。t 值已用日期聚合與重疊修正。</li>" +
      "<li>本益比、股價淨值比(" + esc(W.val_date || "—") + ")與月營收(" + esc(W.rev_month || "—") + ")只有最新一期,<b>沒有回測</b>,是輔助判斷用,不是篩選條件。</li>" +
      "<li>沒有考慮:已下市股票(結果偏樂觀)、漲停買不到、融資融券、大股東申報轉讓。</li></ul></details></section>";
  }

  function spark(vals) {
    var v = vals.filter(function (x) { return x != null; });
    if (v.length < 2) return "";
    var w = 120, h = 28, lo = Math.min.apply(null, v.concat([0])), hi = Math.max.apply(null, v.concat([0])), rg = hi - lo || 1;
    var y = function (x) { return (h - 2 - (x - lo) / rg * (h - 4)).toFixed(1); };
    var pts = v.map(function (x, i) { return (i / (v.length - 1) * w).toFixed(1) + "," + y(x); }).join(" ");
    var lastV = v[v.length - 1];
    return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true">' +
      '<line x1="0" x2="' + w + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)" stroke-dasharray="2 2"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--' + (lastV >= 0 ? "up" : "down") + ')" stroke-width="1.5"/></svg>';
  }

  function stateTag(s) {
    var c = s === "流入" ? "in" : s === "流出" ? "out" : "mid";
    return '<span class="st ' + c + '">' + esc(s) + "</span>";
  }

  function trend() {
    var ts = W.themes, rs = ts.map(function (t) { return t.ret20; }).filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
    var med = rs.length ? rs[Math.floor(rs.length / 2)] : 0;
    function read(t) {
      var strong = (t.ret20 || 0) > med;
      if (t.state === "流入") return strong ? "資金與股價同步走強" : "資金先進場、股價相對落後";
      if (t.state === "流出") return strong ? "股價仍強但資金在撤(背離)" : "資金與股價同步轉弱";
      if (t.state === "轉弱") return "20 日仍流入,近 5 日轉為賣超";
      return "20 日流出,近 5 日開始回流";
    }
    var rows = ts.map(function (t) {
      return '<tr class="' + (t.bottom ? "bot" : "") + '"><td class="rk">' + t.rank + '</td><td class="l nm"><a href="sectors.html#' + esc(t.id) + '">' + esc(t.name) + "</a></td>" +
        '<td class="l">' + stateTag(t.state) + (t.bottom ? '<span class="st bad">墊底</span>' : "") + "</td>" +
        "<td>" + MR.yi(t.net20) + "</td><td class=\"" + dir(t.ratio20) + "\">" + num(t.ratio20, 1, "%") + "</td>" +
        "<td>" + spark(t.trend) + "</td><td>" + pct(t.ret20) + "</td>" +
        "<td>" + (t.pe_med == null ? "—" : t.pe_med.toFixed(1)) + "</td><td class=\"" + dir(t.rev_yoy_med) + "\">" + num(t.rev_yoy_med, 0, "%") + "</td>" +
        '<td class="l read">' + read(t) + "</td></tr>";
    }).join("");
    return '<div class="sec-h"><h2>產業趨勢</h2><p>31 個板塊依「20 日法人買賣超佔成交比」排名。資金方向比股價先反映,但要看持續性。</p></div>' +
      '<div class="evi">' + evi("w_pick", "資金流入板塊中的法人重押股") + evi("w_theme_out", "資金連續撤出的板塊") + evi("w_theme_bottom", "資金排名最後 5 名的板塊") + "</div>" +
      '<div class="tablewrap"><table class="th"><thead><tr><th class="l">#</th><th class="l">板塊</th><th class="l">資金狀態</th><th>20 日法人</th><th>佔成交</th>' +
      "<th>60 日資金走勢</th><th>20 日漲跌</th><th>本益比中位數</th><th>" + esc((W.rev_month || "").slice(5).replace(/^0/, "")) + " 月營收年增中位數</th><th class=\"l\">解讀</th></tr></thead><tbody>" +
      rows + "</tbody></table></div>" +
      '<p class="note">60 日資金走勢 = 每天往回算 20 日法人買賣超佔成交比的變化;線往上代表資金越來越積極。點板塊名稱看成分股。</p>';
  }

  function card(x, risk) {
    var pe = x.pe == null ? "虧損/無" : x.pe.toFixed(1) + (x.pe_med ? '<small style="color:var(--faint);font-weight:400"> /' + x.pe_med.toFixed(0) + "</small>" : "");
    return '<article class="pc"><div class="pc-h"><button type="button" class="stock-link" data-stock="' + esc(x.code) + '"><b>' + esc(x.code) + "</b>" + esc(x.name) + "</button>" +
      (x.stage ? '<span class="stage' + (x.stage === "已發動" ? " go" : "") + '">' + esc(x.stage) + "</span>" : "") +
      '<span class="px" data-px="' + esc(x.code) + '">' + x.close + " " + pct(x.chg) + "</span></div>" +
      '<div class="kpi"><div><span>20 日漲跌</span><b class="' + dir(x.ret20) + '">' + num(x.ret20, 1, "%") + "</b></div>" +
      "<div><span>20 日法人</span><b>" + MR.yi(x.net20) + "</b></div>" +
      "<div><span>本益比/板塊</span><b>" + pe + "</b></div>" +
      "<div><span>月營收年增</span><b class=\"" + dir(x.rev_yoy) + "\">" + num(x.rev_yoy, 0, "%") + "</b></div></div>" +
      '<ul class="why"><li>' + x.why.map(esc).join("</li><li>") + "</li></ul>" +
      (risk && x.risk && x.risk.length ? '<ul class="why risk"><li>' + x.risk.map(esc).join("</li><li>") + "</li></ul>" : "") +
      (x.themes && x.themes.length ? '<div class="chips">' + x.themes.map(function (t) {
        return '<a class="th-chip" href="sectors.html#' + esc(t.id) + '">' + esc(t.name) + "</a>";
      }).join("") + "</div>" : "") + "</article>";
  }

  function list(key, items, limit) {
    var shown = showAll[key] ? items : items.slice(0, limit);
    return '<div class="cards">' + shown.map(function (x) { return card(x, key === "picks"); }).join("") + "</div>" +
      (items.length > limit ? '<button type="button" class="more" data-all="' + key + '">' + (showAll[key] ? "收合" : "顯示全部 " + items.length + " 檔") + "</button>" : "") +
      (items.length ? "" : '<p class="note">今天沒有符合條件的個股。</p>');
  }

  function picks() {
    var items = W.picks.filter(function (x) { return stage === "all" || x.stage === stage; });
    var key = { flow: function (x) { return -(x.ratio20 || 0); }, rev: function (x) { return -(x.rev_yoy == null ? -1e9 : x.rev_yoy); },
      pe: function (x) { return x.pe && x.pe_med ? x.pe / x.pe_med : 1e9; } }[sortBy];
    items = items.slice().sort(function (a, b) { return key(a) - key(b); });
    function seg(name, cur, opts) {
      return '<div class="seg" role="group" aria-label="' + name + '">' + opts.map(function (o) {
        return '<button type="button" data-' + name + '="' + o[0] + '" aria-pressed="' + (o[0] === cur) + '">' + o[1] + "</button>";
      }).join("") + "</div>";
    }
    return '<div class="sec-h"><h2>法人資金流向</h2><p>這份名單看的是「錢往哪裡流」,不是爆發力:防禦性的大型股(例如電信、金融)也會因為法人轉進而入選。要找爆發型個股請看<a href="radar.html" style="color:var(--accent)">起漲雷達</a>。所屬板塊資金 20 日與 5 日都在流入,而且個股 20 日法人買超佔成交比在全市場前 30%。共 ' + W.counts.picks + " 檔。</p></div>" +
      '<div class="evi">' + evi("w_pick", "整份名單") + evi("w_pick_moving", "其中已發動(20 日漲 > 10%)") + evi("w_pick_quiet", "其中未發動(20 日漲 ≤ 10%)") + "</div>" +
      '<div class="tools">' + seg("stage", stage, [["all", "全部"], ["已發動", "已發動"], ["未發動", "未發動"]]) +
      "<span>排序</span>" + seg("sort", sortBy, [["flow", "法人買超比"], ["rev", "營收年增"], ["pe", "本益比相對低"]]) + "</div>" +
      list("picks", items, 12) +
      '<p class="note">「本益比/板塊」= 個股本益比 / 所屬板塊中位數。本益比與營收只供參考,沒有回測。名單不是買進建議:歷史上這群股票平均略優於同類,但多數個股仍會輸給平均。</p>';
  }

  function risk() {
    var bot = W.themes.filter(function (t) { return t.bottom; });
    return '<div class="sec-h"><h2>留意風險</h2><p>歷史上最穩定的訊號在這一側:資金撤退的地方,之後通常表現較差。</p></div>' +
      '<div class="blk"><div class="sec-h"><h2 style="font-size:16px">資金排名墊底的板塊</h2></div>' +
      '<div class="evi">' + evi("w_theme_bottom") + "</div>" +
      '<div class="cards">' + bot.map(function (t) {
        return '<article class="pc"><div class="pc-h"><a class="stock-link" style="text-decoration:none;font-size:16px;font-weight:900" href="sectors.html#' + esc(t.id) + '">' + esc(t.name) + "</a>" +
          stateTag(t.state) + '<span class="px">排名 ' + t.rank + "/" + t.of + "</span></div>" +
          '<div class="kpi"><div><span>20 日法人</span><b>' + MR.yi(t.net20) + "</b></div><div><span>佔成交</span><b class=\"" + dir(t.ratio20) + "\">" + num(t.ratio20, 1, "%") + "</b></div>" +
          "<div><span>20 日漲跌</span><b class=\"" + dir(t.ret20) + "\">" + num(t.ret20, 1, "%") + "</b></div><div><span>近 5 日</span><b>" + MR.yi(t.net5) + "</b></div></div>" +
          spark(t.trend) + "</article>";
      }).join("") + "</div></div>" +
      '<div class="blk"><div class="sec-h"><h2 style="font-size:16px">法人持續調節</h2><p>20 日法人賣超佔成交比在全市場最後 10%,且賣超 ≥ 1 億。共 ' + W.counts.dump + " 檔。</p></div>" +
      '<div class="evi">' + evi("w_dump") + "</div>" + list("dump", W.dump, 9) + "</div>" +
      '<div class="blk"><div class="sec-h"><h2 style="font-size:16px">大幅偏離季線</h2><p>股價高於 60 日均線 50% 以上。共 ' + W.counts.stretch + " 檔。</p></div>" +
      '<div class="evi">' + evi("w_stretch") + "</div>" +
      '<p class="note">這組的平均報酬不差(強者恆強),但中位數明顯為負:多數會回檔、少數繼續大漲。列在這裡是提醒波動風險,不是預測會跌。</p>' +
      list("stretch", W.stretch, 9) + "</div>";
  }

  function render() {
    app.innerHTML =
      '<div class="status"><span>資料日 <b>' + esc(W.date) + '</b></span><span class="sep"></span><span>大盤 <b>' + esc(W.regime_now) + "</b></span>" +
      ('<span class="sep"></span><span id="live-status">' + MR.liveStatus(LIVE, W.date) + "</span>") + (ST ? '<span class="sep"></span><span>回測 <b>' + esc(ST.span[0]) + " ～ " + esc(ST.span[1]) + "</b></span>" : "") + "</div>" +
      verdict() +
      '<div class="tabs"><div class="seg" role="tablist" aria-label="檢視">' +
      [["trend", "產業趨勢"], ["picks", "法人資金流向 " + W.counts.picks], ["risk", "留意風險"]].map(function (o) {
        return '<button type="button" role="tab" data-view="' + o[0] + '" aria-pressed="' + (o[0] === view) + '" aria-selected="' + (o[0] === view) + '">' + o[1] + "</button>";
      }).join("") + "</div></div>" +
      (view === "trend" ? trend() : view === "picks" ? picks() : risk());
    MR.patchPrices(app, LIVE, W.date);
    document.title = "觀察名單 · " + W.date;
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-view],[data-stage],[data-sort],[data-all]");
    if (!b) return;
    if (b.dataset.view) { view = b.dataset.view; history.replaceState(null, "", "#" + view); }
    if (b.dataset.stage) stage = b.dataset.stage;
    if (b.dataset.sort) sortBy = b.dataset.sort;
    if (b.dataset.all) showAll[b.dataset.all] = !showAll[b.dataset.all];
    render();
    if (b.dataset.view || b.dataset.all) MR.refreshIntraday();
  });

  Promise.all([MR.json("data/watch/latest.json"), MR.stats()])
    .then(function (r) {
      W = r[0]; ST = r[1]; render();
      MR.startIntraday(function () { return app; }, W.date, function () { MR.patchPrices(app, LIVE, W.date); });
      return MR.fetchLive(W.date).then(function (lv) { LIVE = lv; render(); });
    })
    .catch(function () { app.innerHTML = '<p class="err">觀察名單資料尚未產生。</p>'; });
})();
</script>
</body>
</html>
