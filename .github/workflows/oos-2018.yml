name: 研究:補 2018 並重考 2010–2018

on:
  push:
    branches: [research/oos-2010]
    paths: [research/oos-2010/trigger-2018.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: oos-2010
  cancel-in-progress: false

jobs:
  history2018:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: 回補 2018 年(被擋就等 10 分鐘再續跑,已抓到的日子會跳過)
        run: |
          for k in 1 2 3 4 5 6; do
            timeout 70m python research/oos-2010/backfill_old.py 2018 || true
            n=$(ls data/history/2018 2>/dev/null | wc -l); echo "round $k: $n days"
            if [ "$n" -ge 240 ]; then break; fi
            sleep 600
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-2018b
          path: |
            data/history/2018
            research/oos-2010/log-2018.txt
          retention-days: 30

  exam:
    needs: history2018
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install -q pandas==3.0.5 numpy==2.5.3
      - name: 取回上次 2010–2017 的資料
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow oos-2010.yml -b research/oos-2010 -L 20 --json databaseId,headSha \
               -q '.[] | select(.headSha=="f0ebbc8a122b401a3947841f1fc2e375d22fcbb5") | .databaseId' | head -1)
          echo "previous run: $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D /tmp/art
      - uses: actions/download-artifact@v4
        with: { name: history-2018b, path: /tmp/art/history-2018b }
      - name: 放回資料夾
        run: |
          R=research/oos-2010/results-full; mkdir -p $R
          for d in /tmp/art/history-*; do cp -rn "$d/data/." data/ 2>/dev/null || true; done
          cp /tmp/art/history-2018b/research/oos-2010/log-2018.txt $R/ 2>/dev/null || true
          cp -rn /tmp/art/revenue-old/data/. data/ 2>/dev/null || true
          echo "history2018=${{ needs.history2018.result }}" > $R/jobs.txt
          ls data/history; for y in 2010 2014 2017 2018; do echo "$y $(ls data/history/$y | wc -l)"; done | tee -a $R/jobs.txt
      - name: 核對凍結程式指紋
        working-directory: research/oos-2010/frozen
        run: |
          printf '%s\n' \
            "fffb13dce184e1b4175a7129fb64589eca7b8d6580734b157c54d170e8b7200f  bt.py" \
            "581d49af4bfc2d2aa7d2a309d6aa7c10e9e3deb60ff59399a6db9fe7b62faf7c  buy.py" \
            "dd5781f2ef58807426482a0cf2e2423abdf8fa04aedf3595f2da4956a322b571  prep.py" \
            "850416d86722245bf4fc1119332b1ab3c129030bf8b546a1c9519196fb7a855d  run_oos.py" > /tmp/sha.txt
          sha256sum -c /tmp/sha.txt | tee ../results-full/sha.txt
      - name: 資料健檢
        run: python research/oos-2010/data_check.py > research/oos-2010/results-full/data_check.json
      - name: 考試(凍結規則)
        run: |
          cd research/oos-2010; R=results-full
          python frozen/prep.py ../.. 2>&1 | tail -3 | tee $R/prep.txt
          python frozen/run_oos.py > $R/oos_2011_2018.json 2> $R/oos_err.txt
          python frozen/run_oos.py 2019-05-01 2100-01-01 > $R/control_2019.json 2>> $R/oos_err.txt
          python limit_check.py > $R/limit_check.json 2>> $R/oos_err.txt || true
      - name: 結果寫回分支
        if: always()
        run: |
          rm -f research/oos-2010/frozen/cache.pkl research/oos-2010/frozen/oos_result.json
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/oos-2010/results-full
          git commit -m "研究:補 2018 後的樣本外考試結果" && git pull --rebase -q && git push
