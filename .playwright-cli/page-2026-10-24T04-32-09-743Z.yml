                - heading "美股晶片股連跌逾一週,CoreWeave信用疑慮未解,費半重挫3.83%、VIX暴漲21% 利空" [level=3] [ref=e301]:
                  - text: 美股晶片股連跌逾一週,CoreWeave信用疑慮未解,費半重挫3.83%、VIX暴漲21%
                  - generic [ref=e302]: 利空
                - paragraph [ref=e303]: 費城半導體指數(SOX)10/16再跌3.83%至11137點,為AI雲端業者CoreWeave信用違約交換(CDS)利差飆破1000個基點(隱含違約機率逾六成)、其2032年到期公司債殖利率一度衝上16%以上所引發的連鎖賣壓,那斯達克同步重挫2.15%,VIX恐慌指數單日暴漲21.45%至19.99,為近期最明顯的一次情緒轉折。輝達執行長黃仁勳曾公開喊話AI投資疑慮只是「暫時性」,但半導體股仍未止跌。台積電ADR同步重摔2.28%至412.61美元,ADR對台股溢價收斂至10.58%,若台股開盤同步反映費半與ADR跌勢,台積電、聯發科等權值股可能承壓。
                - generic [ref=e304]:
