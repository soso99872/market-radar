name: 行情與法人資料

on:
  schedule:
    - cron: "10 21 * * 0-4"   # 台北 05:10(週一至週五):隔夜美股行情 + 前一交易日法人,給 06:00 晨報用
    - cron: "45 8 * * 1-5"    # 台北 16:45:法人資料通常已公布,先更新一次
    - cron: "40 9 * * 1-5"    # 台北 17:40:補齊當日法人與上櫃資料
    - cron: "35 12 * * *"     # 台北 20:35(每天):補抓陸續公布的月營收
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-data.yml
      - scripts/fetch_flows.py
      - scripts/fetch_quotes.py
      - scripts/history.py
      - scripts/signals.py
      - scripts/fundamentals.py
      - scripts/revenue.py
      - scripts/radar.py
      - scripts/valuation.py
      - scripts/fairvalue.py
      - scripts/estimates.py
      - scripts/profile.py
      - scripts/margin.py
      - scripts/quality.py
      - data/sectors/themes.json

permissions:
  contents: write
  issues: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q yfinance
      - name: 抓行情
        run: |
          python scripts/fetch_quotes.py > /tmp/quotes.json && mv /tmp/quotes.json data/quotes.json || echo "::warning::fetch_quotes 失敗"
      - name: 抓法人買賣超並計算板塊
        run: python scripts/fetch_flows.py || echo "::warning::fetch_flows 失敗"
      - name: 本益比與月營收
        run: python scripts/fundamentals.py || echo "::warning::fundamentals 失敗"
      - name: 月營收
        run: python scripts/revenue.py || echo "::warning::revenue 失敗"
      - name: 分析師共識預估(12 小時內抓過就略過)
        run: python scripts/estimates.py || echo "::warning::estimates 失敗"
      - name: 季度毛利率(公開資訊觀測站,補缺期別 + 重抓最近兩季)
        run: python scripts/margin.py || echo "::warning::margin 失敗"
      - name: 財報品質(地雷檢查)與處置 / 注意股
        run: python scripts/quality.py || echo "::warning::quality 失敗"
      - name: 個股基本資料(30 天內抓過就略過)
        run: python scripts/profile.py || echo "::warning::profile 失敗"
      - name: 本益比每月快照
        run: python scripts/valuation.py || echo "::warning::valuation 失敗"
      - name: 訊號回測、觀察名單、起漲雷達與個股資料
        run: python scripts/signals.py || echo "::warning::signals 失敗"
      - name: 資料新鮮度檢查
        run: STALE_FILE=/tmp/stale.txt python scripts/status.py || echo "::warning::status 失敗"
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每次都疊在最新的 main 上,只提交本流程負責的檔案,避免和晨報或其他執行互相覆蓋
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            # --ignore-removal:執行期間若有人推了新檔案,reset 到最新 main 後工作目錄裡沒有它,不能當成刪除提交
            # (曾因此刪掉 data/track/basket_backtest_star.csv)。只有個股檔會真的被移除,另外處理
            git add --ignore-removal data/status.json data/quotes.json data/flows data/sectors/latest.json data/screens data/history data/signals data/watch data/fundamentals data/revenue data/valuation data/estimates data/profile data/margin data/quality data/radar data/track
            git add -A data/stocks
            if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
            git commit -q -m "資料更新 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: 資料延遲時開 issue(會寄信通知),恢復時關閉
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="資料延遲警示"
          num=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number' || true)
          if [ -s /tmp/stale.txt ]; then
            {
              echo "排程 $(TZ=Asia/Taipei date '+%F %H:%M') 檢查到以下資料沒有按時更新:"
              echo
              cat /tmp/stale.txt
              echo
              echo
              echo "詳細:data/status.json;排程紀錄:$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > /tmp/issue.md
            if [ -n "$num" ]; then gh issue comment "$num" --body-file /tmp/issue.md; else gh issue create --title "$title" --body-file /tmp/issue.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "$(TZ=Asia/Taipei date '+%F %H:%M') 檢查:全部資料已恢復正常。"
          fi
