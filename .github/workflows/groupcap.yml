name: 研究:族群上限測試(樣本內)

on:
  push:
    branches: [research/oos-2010]
    paths: [research/groupcap/trigger.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: groupcap
  cancel-in-progress: false

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install -q pandas==3.0.5 numpy==2.5.3
      - name: 取回前兩次的資料
        run: |
          pick() { gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" -b research/oos-2010 -L 20 --json databaseId,headSha \
                   -q ".[] | select(.headSha==\"$2\") | .databaseId" | head -1; }
          a=$(pick oos-2010.yml f0ebbc8a122b401a3947841f1fc2e375d22fcbb5); b=$(pick oos-2018.yml 6fad00b8ce503def3746043a5b060f7c8e7b866c)
          echo "runs: $a $b"
          gh run download "$a" -R "$GITHUB_REPOSITORY" -D /tmp/art1
          gh run download "$b" -R "$GITHUB_REPOSITORY" -D /tmp/art2
          for d in /tmp/art1/history-* /tmp/art2/history-*; do cp -rn "$d/data/." data/ 2>/dev/null || true; done
          cp -rn /tmp/art1/revenue-old/data/. data/ 2>/dev/null || true
      - name: 補缺口(2018-01 前幾天、2013-06 月營收;已有的會跳過)
        run: |
          R=research/groupcap/out; mkdir -p $R
          python research/oos-2010/backfill_old.py 2018 || true
          python research/oos-2010/revenue_old.py || true
          cp research/oos-2010/log-revenue.txt $R/log-revenue-gap.txt 2>/dev/null || true
          grep -E "^2018-01-0" research/oos-2010/log-2018.txt > $R/log-2018-gap.txt || true
          for y in 2010 2011 2012 2013 2014 2015 2016 2017 2018; do echo "$y $(ls data/history/$y | wc -l)"; done | tee $R/jobs.txt
          ls data/revenue/2013-06.json >> $R/jobs.txt 2>&1 || true
      - name: 取回 2004–2009 資料
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pre2010.yml -b research/oos-2010 -L 20 --json databaseId,headSha -q '.[] | select(.headSha=="1858d6bb392685d0a84e496df869e11eef5c2e51") | .databaseId' | head -1)
          echo "pre2010 run: $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D /tmp/pre
          for d in /tmp/pre/pre-*; do cp -rn "$d/data/." data/ 2>/dev/null || true; done
          ls data/history | tr '\n' ' '
      - name: 核對凍結程式指紋
        working-directory: research
        run: |
          printf '%s\n' \
            "5cc9d2ad4238f00b5ee11f3b5a37552191a8cf4e19829e1b0472efda12529a34  oos-pre2010/exam_pre.py" \
            "fffb13dce184e1b4175a7129fb64589eca7b8d6580734b157c54d170e8b7200f  oos-2010/frozen/bt.py" \
            "581d49af4bfc2d2aa7d2a309d6aa7c10e9e3deb60ff59399a6db9fe7b62faf7c  oos-2010/frozen/buy.py" \
            "dd5781f2ef58807426482a0cf2e2423abdf8fa04aedf3595f2da4956a322b571  oos-2010/frozen/prep.py" > /tmp/sha.txt
          sha256sum -c /tmp/sha.txt | tee groupcap/sha.txt
      - name: 確認沒加上限時跟 compare.sim 逐日一樣，再跑
        run: |
          mkdir -p research/groupcap/out
          cd research/oos-2010 && python frozen/prep.py ../.. 2>&1 | tail -2; cd ../groupcap
          python groupcap.py --check | tee out/check.json
          python -c "import json;d=json.load(open('out/check.json'));assert len(d)==3 and max(d.values())<1e-9, d"
          python groupcap.py > out/results.json 2> out/progress.txt
      - name: 結果寫回分支
        if: always()
        run: |
          rm -f research/oos-2010/frozen/cache.pkl
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/groupcap
          git commit -m "研究:族群上限測試結果(樣本內)" && git pull --rebase --autostash -q && git push
