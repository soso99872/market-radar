                  - generic [ref=e337]: 視數據而定
                - paragraph [ref=e338]: 美國聯準會將於10/27-28召開FOMC會議,利率決議約於台北時間10/29凌晨公布;同日稍晚(台北時間10/29晚間20:30)將公布美國第三季GDP初值與9月PCE物價指數。市場先前在Fed主席Warsh於Jackson Hole發表偏鷹言論後,一度將9月升息機率由34%上修至54%,目前聯邦資金利率區間約為3.75%至4.00%。若PCE通膀數據高於預期或FOMC決議偏鷹,將強化再升息預期,推升美元與殖利率,對科技成長股估值形成壓力;若數據降溫或Fed維持不變,風險情緒可望緩和。此外,Meta、蘋果等美股大型科技公司預計於本週(約10/28-10/29前後)密集公布財報,AI資本支出指引能否說服市場將是觀察重點。
