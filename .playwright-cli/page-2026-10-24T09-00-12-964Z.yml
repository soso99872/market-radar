                  - text: 風險資產與避險資產同步下跌,顯示市場出現去風險(deleveraging)跡象
                  - generic [ref=e313]: 利空
                - paragraph [ref=e314]: VIX恐慌指數單日急升15.11%至19.2,同時美10年債殖利率下跌3.52個基點、美元指數小跌0.23%,但黃金重挫2.16%、比特幣下跌3.21%。殖利率與美元走弱卻未能撐住黃金與比特幣,顯示本輪賣壓較可能是資金全面減碼風險部位、回補保證金所致,而非單純轉向傳統避險資產;若去風險情緒持續擴大,新興市場與台股等風險資產仍可能承壓,反之若VIX回落,資金可能重新分散配置。
