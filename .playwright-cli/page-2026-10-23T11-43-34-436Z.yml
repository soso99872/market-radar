                  - generic [ref=e320]: 中性
                - paragraph [ref=e321]: 據板塊資金流資料,電信、鋼鐵、航運、金融等板塊20日法人資金持續淨流入,其中電信20日淨流入184億元、資金排名全市場31個板塊中第1,金融淨流入437億元排名第4;相對地,晶圓代工連續12日遭資金淨流出,20日累計淨流出3450億元,外資在台積電等權值股的賣壓最為明顯。此現象僅為事實陳述,反映近期AI急殺後資金階段性轉往傳統內需或高息板塊,若隔夜美股晶片股賣壓延續,晶圓代工資金流出狀態可能持續;若AI鏈情緒回穩,資金亦可能重新流入。
