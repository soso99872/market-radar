                  - text: 外資台指期淨空單維持相對高檔,官方最新資料僅至10/13
                  - generic [ref=e328]: 視數據而定
                - paragraph [ref=e329]: 據財經媒體整理,外資台指期未平倉淨空單在10/13約為8.7萬口,處於9月下旬以來的相對高檔區間(7.6萬至8.7萬口),但期交所官方資料目前僅更新至該日,尚無法確認10/22當日的期貨籌碼變化。若外資於隔夜美股重挫後同步在台指期加碼空單,台股開盘上方賣壓恐增加;若外資轉為回補空單,則可能減緩下跌動能。
