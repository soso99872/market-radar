                - paragraph [ref=f1e281]: 10/22三大法人合計賣超994.67億元,其中外資賣超815.82億元、自營商賣超273.77億元,僅投信逆勢買超94.92億元。法人轉趨保守的態度與隔夜美股AI晶片鏈重挫的氣氛相呼應;若外資今日持續調節,台股開盘量能與情緒恐進一步受壓,投信逆勢買超的防禦性佈局則可能提供部分緩衝。
                - generic [ref=f1e282]: 台股
