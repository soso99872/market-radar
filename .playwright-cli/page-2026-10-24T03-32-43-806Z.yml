                  - text: 外資台指期淨空單維持相對高檔,官方最新資料僅至10/13
                  - generic [ref=f2e302]: 視數據而定
                - paragraph [ref=f2e303]: 據財經媒體整理,外資台指期未平倉淨空單在10/13約為8.7萬口,處於9月下旬以來的相對高檔區間(7.6萬至8.7萬口),但期交所官方資料目前僅更新至該日,尚無法確認10/22當日的期貨籌碼變化。若外資於隔夜美股重挫後同步在台指期加碼空單,台股開盘上方賣壓恐增加;若外資轉為回補空單,則可能減緩下跌動能。
                - generic [ref=f2e304]: 台股
            - listitem [ref=f2e306]:
              - generic [ref=f2e308]:
                - heading "本週聚焦FOMC利率決議與美國GDP、PCE物價數據,科技巨頭財報週同步登場 視數據而定" [level=3] [ref=f2e309]:
                  - text: 本週聚焦FOMC利率決議與美國GDP、PCE物價數據,科技巨頭財報週同步登場
                  - generic [ref=f2e310]: 視數據而定
                - paragraph [ref=f2e311]: 美國聯準會將於10/27-28召開FOMC會議,利率決議約於台北時間10/29凌晨公布;同日稍晚(台北時間10/29晚間20:30)將公布美國第三季GDP初值與9月PCE物價指數。市場先前在Fed主席Warsh於Jackson Hole發表偏鷹言論後,一度將9月升息機率由34%上修至54%,目前聯邦資金利率區間約為3.75%至4.00%。若PCE通膀數據高於預期或FOMC決議偏鷹,將強化再升息預期,推升美元與殖利率,對科技成長股估值形成壓力;若數據降溫或Fed維持不變,風險情緒可望緩和。此外,Meta、蘋果等美股大型科技公司預計於本週(約10/28-10/29前後)密集公布財報,AI資本支出指引能否說服市場將是觀察重點。
